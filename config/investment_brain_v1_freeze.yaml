    # ═══════════════════════════════════════════════════════════
    # Hypothesis Verdicts
    # ═══════════════════════════════════════════════════════════
    hypothesis_verdicts:
      H1_score_incremental:
        verdict: "REJECTED"
        evidence: "Q5 (highest score) alpha = +0.22% is NOT > Q1 = +0.23%. Score does not add monotonic value. b2 not significant. R²=0.006."
        implication: "FRM score is NOT a quality measure that adds linear value."
      H2_direction_only:
        verdict: "PARTIALLY SUPPORTED"
        evidence: "direction-only (+2.53%) ≈ full FRM (+2.52%), delta +0.01pp. Direction reproduces 99.6% of alpha at group level."
        caveat: "BUT within improving, score DOES discriminate (Q3 +6.94% vs Q5 +0.22%). Direction is sufficient at group level, but score carries non-monotonic information."
        implication: "Direction is the primary signal, but discarding score entirely would lose the inverted-U information."
      H3_uncertainty_asymmetry:
        verdict: "STRONGLY SUPPORTED"
        evidence: "FRM score within improving shows inverted-U: Q3 (+6.94%) >> Q1 (+0.23%) AND >> Q5 (+0.22%). This is the FOURTH signal showing inverted-U."
        implication: "FRM score is an uncertainty proxy, not a quality measure. High score = high certainty = market already priced it in = no alpha."

    # ═══════════════════════════════════════════════════════════
    # The Four-Signal Inverted-U Pattern (critical finding)
    # ═══════════════════════════════════════════════════════════
    four_signal_inverted_u:
      gap_v3_3_1:
        signal: "expectation_gap (market disagreement)"
        pattern: "Q2-Q4 sweet spot (+1.5% to +2.0%), Q5 worst (-6.3%)"
        source: "v3.3.1 autopsy"
      sustainability_v3_4:
        signal: "sustainability_pass (fundamental credibility)"
        pattern: "Q2-Q3 peak (+3.6% to +5.7%), Q5 worst (+0.6%)"
        source: "v3.4 Phase 1.5 ablation"
      frm_score_v3_5_exp1:
        signal: "FRM score (recovery quality)"
        pattern: "Q3 peak (+6.94%), Q5 worst (+0.22%), Q1 also low (+0.23%)"
        source: "this experiment"
      earnings_acceleration_exploration:
        signal: "EA (earnings acceleration)"
        pattern: "Q2 peak (+4.89%), Q5 worse (+1.79%)"
        source: "v3.5 pre-freeze exploration"
      common_shape: "ALL FOUR show inverted-U. Alpha is in the middle, not the extremes."
      economic_interpretation: |
        Alpha lives in the maximum-information-asymmetry zone. Extremes
        (very high OR very low on ANY signal) are either already known
        to the market or over-priced:
          - Very high gap = market distrusts (justified skepticism)
          - Very high sustainability = market already priced in quality
          - Very high FRM score = market already priced in recovery
          - Very high EA = extreme acceleration is suspect (one-off)
        The middle zone is where the market is UNCERTAIN whether the
        recovery is real - that uncertainty is the alpha source.

    # ═══════════════════════════════════════════════════════════
    # What Exp1 Proved
    # ═══════════════════════════════════════════════════════════
    what_exp1_proved:
      - "FRM score adds ZERO incremental alpha at group level (direction-only = full FRM, delta +0.01pp)"
      - "FRM score is NOT monotonic with alpha (H1 rejected, Q5 not > Q1)"
      - "FRM score shows INVERTED-U within improving (H3 supported, Q3 >> Q5)"
      - "The alpha source is NOT quality (highest quality = worst alpha)"
      - "The alpha source IS uncertainty asymmetry (middle zone = max alpha)"
      - "Signal is temporally STABLE (positive in 2023 and 2024, spread only 2.10pp)"
      - "Direction is the primary gate; score carries non-monotonic uncertainty information"

    what_exp1_did_not_solve:
      - "Is the inverted-U truly universal, or specific to recovery episodes? (needs non-recovery control)"
      - "What is the optimal middle-zone definition? (Q2-Q3? Q2-Q4? needs larger N)"
      - "Does combining moderate-gap AND moderate-FRM AND moderate-sustainability amplify alpha? (Phase 2 exp8)"
      - "Why does the market over-price high-certainty stocks? (behavioral question, out of scope)"

    # ═══════════════════════════════════════════════════════════
    # Frozen Diagnostic Rules
    # ═══════════════════════════════════════════════════════════
    frozen_diagnostic_rules:
      frm_score_not_quality: "FRM score is an uncertainty proxy, NOT a quality measure. High score does NOT mean high alpha."
      frm_score_not_monotonic: "FRM score MUST NOT be used as a monotonic 'higher is better' signal. Q5 (highest) has WORST alpha than Q1."
      frm_direction_is_primary: "Direction (improving/stable, hard-reject deteriorating) is the primary gate. Score is secondary."
      middle_zone_is_alpha: "The alpha zone is MODERATE FRM score (Q2-Q3, frm 57-68), not high score."
      extreme_high_is_risk: "Very high FRM score (Q5, frm 74+) is a RISK signal, not opportunity. Market has already priced in the recovery."

    # ═══════════════════════════════════════════════════════════
    # Impact on v3.5 Direction
    # ═══════════════════════════════════════════════════════════
    impact_on_v3_5:
      h3_now_leading: |
        H3 (Uncertainty Asymmetry) is now the leading hypothesis. Four
        independent signals showing the same inverted-U is strong
        evidence. The remaining experiments (exp2-exp8) should focus
        on VALIDATING and OPERATIONALIZING H3, not distinguishing H1
        (already rejected) or H2 (partially supported but subsumed by H3).
      exp2_layer_ablation_priority: "LOWER - since score is non-monotonic, layer ablation (which layer drives the score) is less important than understanding the inverted-U."
      exp6_frm_x_ea_priority: "HIGHER - if both FRM score and EA show inverted-U, their 2D matrix may reveal whether they capture the SAME uncertainty or independent dimensions."
      exp8_3d_cube_priority: "HIGHEST - combining moderate-gap + moderate-sustainability + moderate-FRM may be the key experiment. If all three 'middle zones' overlap, the alpha may be amplified."

    # ═══════════════════════════════════════════════════════════
    # Sample Size Caveat
    # ═══════════════════════════════════════════════════════════
    sample_size_caveat: |
      N=60 (Group A), N=45 within improving for quintile analysis
      (9 per quintile). The inverted-U pattern is clear (Q3 +6.94%
      vs Q5 +0.22% is a 6.72pp spread), but statistical significance
      is limited. The regression b2 t-stat is -0.55 (not significant).
      The four-signal convergence (gap, sustainability, FRM, EA all
      showing inverted-U) is the strongest evidence, not any single
      experiment. Phase 2 experiments with larger N (extending
      backfill) should confirm before operationalizing.

    next_phase: "Phase 1 exp2 (layer ablation, LOWER priority) OR skip to Phase 2 exp8 (3D cube: moderate-gap x moderate-sustainability x moderate-FRM, HIGHEST priority)"

