    # ═══════════════════════════════════════════════════════════
    why_valuable: |
      Scenario B is the MOST INFORMATIVE outcome. It tells us:
        1. Guardian's confidence DOES contain risk information (not noise)
        2. But the information is not clean enough to drive capital
        3. The false blocks reveal WHERE ARS is confused: it catches
