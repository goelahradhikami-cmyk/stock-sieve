        rule_2: "State as ranking? -> REJECT"
        rule_3: "Stock factor? -> REJECT"
        rule_4: "Allowed scope? -> check"
        rule_5: "Complexity > budget? -> REJECT"
        rule_6: "Explanation before stability? -> REJECT"
        rule_7: "Research without complete ledger? -> REJECT"
        rule_8: "NEW: Temporal purity violation? -> REJECT"

    # ═══════════════════════════════════════════════════════════
    # Exp0E - Calibration Drift Test (frozen design)
    # ═══════════════════════════════════════════════════════════
    exp0e_calibration_drift:
      purpose: "Financial markets' biggest enemy is not error - it's capability decay"
      method: |
        Rolling yearly calibration: for each year (2021, 2022, 2023, 2024,
        2025, 2026), compute confidence bucket -> actual win rate.
        Observe: does high confidence ALWAYS produce high win rate?
        Or: 2021 effective, 2025 failed?
      question: "Is confidence calibration STABLE across time, or does it decay?"
      success: "High confidence (Q4-Q5) win rate > Low confidence (Q1-Q2) in EVERY year"
      failure: "Calibration decays over time. Confidence was a period-specific artifact."
      why_critical: |
        If calibration is stable across years, confidence is a REAL ASSET.
        If it decays, it was a period-specific pattern (like Mid×Mid).
        This is the difference between a durable edge and a lucky streak.
      priority: "P0 for OOS validation - must run alongside standard OOS split"

    # ═══════════════════════════════════════════════════════════
    # Regime Risk Modifier Design (frozen for Exposure Controller)
    # ═══════════════════════════════════════════════════════════
    regime_risk_modifier: |
      Exposure Controller cannot use confidence alone. Needs regime override:

        Base Risk Budget = f(confidence)
        Adjusted Risk Budget = Base + Regime Modifier

        PANIC:    + recovery allowance (Guardian over-blocks; allow early position)
                  modifier: +0.15 (or override BLOCK -> small position)
        STABILIZING: normal (Guardian best here, 69.2% block accuracy)
                  modifier: 0.0
        EARLY_RECOVERY: normal
                  modifier: 0.0
        CONFIRMED_RECOVERY: full (Guardian best at BUY here)
                  modifier: +0.05 (slight boost)
        EUPHORIA:  - caution (extreme = risk, per v3 chain)
                  modifier: -0.10

      This is NOT stock selection. It is exposure policy conditioned on
      Guardian's known failure modes. The PANIC override is the most
      important: it prevents the classic 'risk model dies at the bottom'.

