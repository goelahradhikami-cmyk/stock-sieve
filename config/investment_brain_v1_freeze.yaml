# ═════════════════════════════════════════════════════════
# Investment Brain Layered Architecture (v1.1)
# ═════════════════════════════════════════════════════════

investment_brain_layers:
  layer_1_market_guardian:
    status: "FROZEN v1.1 (2026-07-21)"
    rating: "★★★★★"
    validation: "6-S.11.2 Regime Transfer PASS + 6-S.11.3 Bootstrap PASS"
    responsibility: "Market-layer risk defence (BUY/BLOCK decision)"
    code: "src/thesis/state_transition.py, src/thesis/confidence_overlay.py"
    key_finding: "Timing Intelligence is independently valuable"

  layer_2_security_analyst:
    status: "DIAGNOSTIC_BASELINE v3.2 - four-layer capability mapped, mispricing hypothesis is the bottleneck"
    production: false
    rating: "★★☆☆☆"
    responsibility: "Stock selection layer ('what to buy')"

    # Four-layer capability map (v3.2 contribution):
    # Proves WHERE the error is, not just THAT there is an error.
    four_layer_capability_map:
      market_timing:
        layer: "Market Guardian"
        rating: "★★★★★"
        status: "FROZEN v1.1 - proven (1204 episodes, P(loss)=0.00%)"
      recovery_eligibility:
        layer: "Stage 1 FRM Gate"
        rating: "★★★☆☆"
        status: "VALIDATED v3.1 - eliminates deteriorating stocks (88% improving)"
      relative_strength:
        layer: "Stage 2 RS Gate"
        rating: "★★★☆☆"
        status: "PARTIAL v3.2 - reduces market_beta (-2.38% -> -1.08%) but sector_beta rose"
      mispricing_detection:
        layer: "Stage 3 Anomaly"
        rating: "☆☆☆☆☆"
        status: "BOTTLENECK v3.2 - residual_alpha still -4.30% after Stage 1+2 filtering"
        diagnosis: "The 'drawdown + cheap + not broken = mispriced' hypothesis is wrong in recovery markets. Many stocks are 'deservedly cheap but won't rise', not mispriced."
    v2_reconstruction:
      commit: "6-S.12"
      date: "2026-07-21"
      tag: "security-analyst-v2-diagnostic"
      freeze_status: "NOT FROZEN - diagnostic baseline only (residual_alpha target not met)"
      components:
        - "6-S.12.1: Recovery Beta Decomposition (market_beta + sector_beta + residual_alpha)"
        - "6-S.12.2: Fundamental Recovery Layer (FRM Score, earnings_yoy revision proxy)"
        - "6-S.12.3: Sector Confirmation Layer (relative strength vs sector)"
        - "6-S.12.4: Portfolio Construction Validation (shadow_portfolio_construction table)"
        - "6-S.12.5: v2 replay comparison vs v1"
      v2_results:
        residual_alpha_v1: "-5.71% mean (18.2% positive)"
        residual_alpha_v2: "-5.01% mean (16.7% positive)"
        improvement: "+0.70pp (marginal, still negative)"
        frm_direction_v1: "61% deteriorating stocks selected"
        frm_direction_v2: "67% improving stocks selected"
        interpretation: "V2 corrected the direction (improving vs deteriorating) but residual_alpha remains negative. The anomaly detection itself may be the binding constraint, not the scoring layer."
      validation_targets:
        buy_alpha_target: ">+2%"
        buy_alpha_v2: "+4.50% (improved from +4.30%, but mostly market beta)"
        residual_alpha_target: ">0"
        residual_alpha_v2: "-5.01% (NOT MET)"
      verdict: "CONDITIONAL - V2 improves direction but does not produce positive true selection alpha. Anomaly detection redesign (v3) may be needed."
    known_issues:
      - "Doctrine shuffle showed no incremental alpha (6-S.9)"
      - "G4-B: 3/133 selection leaks (alpha<0) during recovery BUYs"
      - "2025-08-13 selected only 1 stock (diversification failure, now tracked in shadow_portfolio_construction)"
      - "V2 residual_alpha still negative (-5.01%) - anomaly detection itself may be flawed"
      - "V1 systematically selected deteriorating stocks (61%); V2 corrected to 67% improving but alpha still negative"
    next_step: "Security Analyst v3: redesign Candidate Generator (not scoring layer). See v3_roadmap below."

    v3_roadmap:
      commit: "6-S.13 (planned)"
      diagnosis: |
        v2 proved the problem is candidate generation, not scoring.
        MarketAnomalyDetector's implicit assumption is:
          drawdown + cheap + fundamentals not broken = mispriced opportunity
        But in recovery markets this often fails because many stocks are
        'deservedly cheap' (earnings deterioration + industry decline +
        capital outflow), not mispriced. V2's FRM improved direction
        (61% deteriorating -> 67% improving) but residual_alpha stayed
        negative (-5.01%), confirming the candidate pool itself lacks alpha.
      architecture: "Three-stage funnel (replaces single anomaly score)"
      stage_1_recovery_eligibility_gate:
        purpose: "Does the stock have the right to participate in recovery?"
        gates:
          - "Earnings acceleration > 0 (earnings_yoy improving, not just high)"
          - "FRM direction = improving (v2 proved this filters deteriorating stocks)"
          - "Kill criteria (frozen, retained from v1)"
      stage_2_relative_strength_confirmation:
        purpose: "Is the stock actually leading, not just riding sector beta?"
        filters:
          - "Relative strength = stock_return - sector_return > 0"
          - "Sector strength = sector_return - market_return (sector leading market)"
          - "Replaces drawdown as primary filter (drawdown finds cheap, RS finds strong)"
      stage_3_mispricing_detection:
        purpose: "Is the stock cheap AFTER passing recovery + strength gates?"
        filters:
          - "Valuation gap (retained from anomaly detector, but as last gate not first)"
          - "Divergence score (business_strength - market_pessimism)"
      phased_targets:
        v3_1: "FRM improving rate > 85% (from v2's 67%)"
        v3_2: "residual_alpha > -2% (from v2's -5.01%)"
        v3_3: "residual_alpha > 0 (true selection alpha)"
      principle: "Do NOT let Security Analyst break Market Guardian. Three intelligence layers stay permanently separated: Market / Security / Portfolio."

      # ═══════════════════════════════════════════════════════════
      # 6-S.13.1 Design Freeze (2026-07-21)
      # The following four contracts are FROZEN. Coding phases must not
      # deviate. Any change requires a new design freeze + user approval.
      # ═══════════════════════════════════════════════════════════
      design_freeze:
        freeze_date: "2026-07-21"
        freeze_version: "6-S.13.1"

        # --- Contract 1: Schema ---
        schema:
          mispricing_object_extension:
            new_dataclass: "V3CandidateFeatures"
            fields:
              recovery_score: "Optional[float], Stage 1 composite 0-100"
              earnings_acceleration: "Optional[float], earnings_yoy_current - previous"
              frm_direction: "Optional[str], improving/stable/deteriorating"
              frm_score: "Optional[float], FRM score 0-100 (reuses 6-S.12.2)"
              relative_strength: "Optional[float], stock_return - sector_return"
              sector_strength: "Optional[float], sector_return - market_return"
              rs_score: "Optional[float], Stage 2 composite 0-100"
              liquidity_pass: "Optional[bool], Stage 1 liquidity gate"
              candidate_stage: "Optional[str], stage1_pass/stage2_pass/stage3_pass/rejected"
              rejection_reason: "Optional[str], LOW_LIQUIDITY/DETERIORATING/WEAK_RS/NO_MISPRICING"
            attachment: "MispricingObject.v3_features: Optional[V3CandidateFeatures] = None"
            compatibility: "KillCriteria and DoctrineUnderwriter read core fields only, never v3_features"

          new_table_shadow_funnel_log:
            purpose: "Record every stock's fate through the three-stage funnel"
            columns: "episode_id, trade_date, stock_code, stage1_*/stage2_*/stage3_* fields, final_pass, rejection_stage, rejection_reason"
            note: "shadow_candidates only stores Stage 3 survivors; funnel_log captures the full picture"

          new_table_security_candidate_universe_snapshot:
            purpose: "Snapshot of the universe that entered Stage 1 per trade_date"
            columns: "trade_date, security_id, source, liquidity_pass, eligible, reject_reason"

          shadow_candidates_v3_fields:
            v3_recovery_score: "REAL"
            v3_rs_score: "REAL"
            v3_candidate_stage: "TEXT"
            v3_funnel_rank: "INTEGER"

        # --- Contract 2: Scoring Contract ---
        scoring_contract:
          output_type: "list[MispricingObject] with v3_features populated"
          stage_1_recovery_eligibility:
            universe_source: "stock_factor_snapshot (FROZEN - not UniverseFilter)"
            gates:
              liquidity: "volume_ratio from factor_values_json > 0.3"
              frm_hard_reject: "deteriorating"
              frm_soft_pass: "improving"
              frm_observe: "stable"
            recovery_score_formula: "0.35*earnings_accel + 0.25*margin + 0.20*sector_strength + 0.20*relative_strength"
            disabled_filters:
              st_filter: "snapshot_missing_historical_ST_status"
              listing_age: "historical_missing"
              universe_filter: "avoid_historical_leakage_from_avg_amount_20d"

          stage_2_relative_strength:
            scorer: "SectorConfirmationScorer (6-S.12.3, reused)"
            hard_gate: "rs_vs_sector > 0 (when data_available)"
            soft_gate: "pre-2024-06 data unavailable -> skip hard gate, log"
            four_quadrant:
              strong_stock_strong_sector: "KEEP (best)"
              strong_stock_weak_sector: "KEEP (stock alpha)"
              weak_stock_strong_sector: "REJECT (WEAK_RS)"
              weak_stock_weak_sector: "REJECT (WEAK_RS)"

          stage_3_mispricing:
            detector: "MarketAnomalyDetector._detect_anomaly (reused, not rewritten)"
            role: "LAST gate, not first (reverses v1/v2 order)"
            ranking: "divergence_score descending (retained from v1/v2)"

          interface_compatibility:
            kill_criteria: "UNCHANGED - KillCriteria.check(MispricingObject) reads core fields only"
            doctrine_underwriter: "UNCHANGED - underwrite_all(MispricingObject) reads core fields only"
            v3_features_rule: "advisory only; frozen modules cannot depend on them"

        # --- Contract 3: Validation Metrics ---
        validation_metrics:
          phased_targets:
            v3_1: "FRM improving rate > 85% (baseline v2: 67%)"
            v3_2: "residual_alpha > -2% (baseline v2: -5.01%)"
            v3_3: "residual_alpha > 0 (true selection alpha)"
          replay_contract: "run_security_analyst_v3_replay.py compares v1 vs v2 vs v3"
          replay_outputs:
            - "v3 candidate pool size vs v1/v2 (funnel convergence rate)"
            - "v3 FRM improving rate vs v2"
            - "v3 residual_alpha vs v2"
            - "shadow_funnel_log stats (per-stage drop rate + reason distribution)"
            - "three-way comparison report data/reports/security_analyst_v3_replay_{date}.md"
          data_constraints:
            stock_factor_snapshot: "106 dates x ~1000 stocks (universe boundary)"
            industry_daily_returns: "2024-06-04+ only (Stage 2 degrades to soft gate pre-2024-06)"
            hs300_market_index_daily: "2021-05+ (market return, full coverage)"
            akshare_financials: "33 quarters (FRM, vintage-aware, full coverage)"

        # --- Contract 4: No-Touch Boundary ---
        no_touch_boundary:
          market_guardian:
            state_transition: "FROZEN - src/thesis/state_transition.py unchanged"
            confidence_overlay: "FROZEN - src/thesis/confidence_overlay.py unchanged"
            freeze_yaml_parameters: "FROZEN - parameters section unchanged"
          risk_boundary:
            kill_criteria: "UNCHANGED - src/thesis/thesis_ledger.py KillCriteria unchanged"
            doctrine_underwriter: "UNCHANGED - src/thesis/doctrine_underwriting.py unchanged"
          allowed_changes:
            - "src/thesis/market_anomaly.py: add V3CandidateFeatures + MispricingObject.v3_features"
            - "src/thesis/candidate_generator.py: NEW"
            - "scripts/shadow_recorder.py: line 97 replace detector.scan() with CandidateGenerator.generate()"
            - "migrations/shadow_trading_schema_v3.sql: NEW"
            - "scripts/run_security_analyst_v3_replay.py: NEW"
          prohibited:
            - "MUST NOT modify StateTransitionEngine / RecoveryConfidence"
            - "MUST NOT modify KillCriteria.check() signature"
            - "MUST NOT modify DoctrineUnderwriter.underwrite_all() signature"
            - "MUST NOT change shadow_episode.decision (BUY/BLOCK remains Guardian's job)"
            - "v3 does ranking/filtering ONLY, never permission"

        # --- Implementation Phases ---
        implementation_phases:
          phase_1_6_S_13_1: "Design Freeze (this document) - no coding"
          phase_2_6_S_13_2: "Recovery Eligibility Gate (Stage 1 + MispricingObject extension + migration v3)"
          phase_3_6_S_13_3: "Relative Strength Stage (Stage 2 + batch SectorConfirmation)"
          phase_4_6_S_13_4: "Mispricing Stage + orchestration (Stage 3 + replace shadow_recorder line 97)"
          phase_5_6_S_13_5: "v3 Replay + validation (compare v1/v2/v3, verify v3.1 FRM>85%)"
          phase_6: "Commit + tag if v3.1 passes, else report and adjust"

  layer_3_portfolio_construction:
    status: "DIAGNOSTIC ACTIVE - shadow_portfolio_construction table populated"
    rating: "★☆☆☆☆"
    responsibility: "Portfolio layer ('how much to bet')"
    note: "Bayesian Allocation frozen; shadow_portfolio_construction table (6-S.12.4) tracks concentration failures independently. 4/8 BUY episodes with selected stocks FAIL diversification gates."
    v2_findings:
      - "4/8 BUY episodes FAIL diversification (min_positions<5, concentration>25%, or sector>40%)"
      - "2025-08-13: FAIL_MIN_POSITIONS+FAIL_CONCENTRATION+FAIL_SECTOR (1 stock, 100% weight)"
      - "Portfolio layer failures isolated from selection layer failures via independent table"

# Key architectural insight (v1.1): Timing Intelligence != Selection Intelligence.
# Market Guardian proved the former can produce value independently.
# The selection layer is now the binding constraint on system alpha.

# ═════════════════════════════════════════════════════════
# Evolution v4 Constraints
# ═════════════════════════════════════════════════════════

evolution_v4:
  status: disabled
  enabled_after: "security_analyst_reconstruction_v2"
  # Evolution v4 was originally gated on shadow_trading_30_episodes.
  # That target is now far exceeded (1204 episodes). v1.1 re-gates
  # Evolution v4 on the Security Analyst reconstruction, because
  # optimising Market Guardian further has diminishing returns while
  # the selection layer remains the binding constraint.
  
  # What Evolution CAN optimize
  search_space:
    - "confidence weights (vol/trend/breadth)"
    - "confidence threshold"
    - "anomaly detection parameters"
    - "state transition rules"
    - "kill criteria thresholds"
  
  # What Evolution CANNOT touch
  frozen:
    - "doctrine underwriting logic"
    - "belief audit framework"
    - "thesis ledger schema"
    - "investment memory 4-state model"
  
  # Fitness function (NOT raw return)
  fitness:
    target: "risk_adjusted_decision_quality"
    components:
      alpha: 0.40
      downside_protection: 0.30
      false_recovery_avoidance: 0.20
      opportunity_capture: 0.10

# ═════════════════════════════════════════════════════════
# Shadow Trading Protocol
# ═════════════════════════════════════════════════════════

shadow_trading:
  status: "FROZEN v1.1 (episode accumulation goal achieved)"
  goal: "episode_accumulation (not return validation)"
  min_episodes: 30
  achieved_episodes: 1204
  achieved_date_range: "2021-08-11 to 2026-07-10"
  min_market_coverage:
    bull: 5
    bear: 10
    sideway: 10
    recovery: 5

  # Prohibited during shadow trading
  prohibited:
    - "parameter tuning"
    - "human intervention in decisions"
    - "evolution optimization"

  # Episode = one Market Guardian directional decision
  episode_definition: "state + confidence + decision + outcome"

  # Counterfactual required for every BLOCK
  counterfactual: true

