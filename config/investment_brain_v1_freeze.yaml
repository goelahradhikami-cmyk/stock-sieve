    commit: "6-S.21.1"
    tag: "stock-sieve-v4.0-ars-redefinition"
    scope: "ARS -> MUS redefinition + unified pattern freeze + Gate 1.6 State Decomposition design"
    freeze_status: "CONTRACT FROZEN (ARS redefined as uncertainty detector, not risk filter; unified pattern recognized across v2-v4)"

    # ═══════════════════════════════════════════════════════════
    # Route B Chosen (with redefinition, not closure)
    # ═══════════════════════════════════════════════════════════
    route_b_chosen: |
      B chosen. A rejected. C partially rejected.

      A (ARS v2) rejected: the problem is NOT model complexity. The
      target was wrong. ARS was designed as 'danger detector' but data
      proves it is 'uncertainty detector'. Optimizing a wrong target
      re-enters v3's cycle.

      C (kill ARS) partially rejected: ARS has genuine information
      (Tests 1-3 pass, CI excludes zero). Killing it discards real
      evidence. But it cannot drive capital (Test 4 fail).

      B (accept as diagnostic) chosen WITH redefinition: ARS is not a
      failed risk filter. It is a validated uncertainty detector being
      asked the wrong question.

    # ═══════════════════════════════════════════════════════════
    # ARS Redefinition (frozen)
    # ═══════════════════════════════════════════════════════════
    ars_redefinition: |
      ARS captures 'high uncertainty state', NOT 'pure risk state'.

      Evidence:
        Tests 1-3: high ARS -> worse average outcomes (identifies abnormal)
        Test 4: false blocks miss +3.86% (above-average upside)

      Interpretation:
        High ARS = market is in an abnormal/uncertain state
        Abnormal states contain BOTH danger AND opportunity
        ARS cannot directionalize: risk vs opportunity coexist

      Renamed: ARS -> Market Uncertainty Score (MUS)
      (retaining 'ARS' in code for continuity, but meaning = MUS)

      MUS does NOT control capital. It controls ATTENTION BUDGET:
        high MUS -> 'this opportunity is in an abnormal zone, review carefully'
        low MUS -> 'normal conditions, proceed normally'

      MUS is not a filter. It is a FLAG for committee review.

    # ═══════════════════════════════════════════════════════════
    # The Unified Pattern (frozen - the deepest finding of v2-v4)
    # ═══════════════════════════════════════════════════════════
    unified_pattern: |
      The entire v2-v4 chain reveals ONE consistent pattern:

        The system can IDENTIFY market extremes but cannot
        DIRECTIONALIZE them (risk vs opportunity).

      v2: cheap stocks = could be opportunity OR value trap
      v3 EGE: extreme recovery = could be underreaction OR distrust
      v3.4: extreme quality = could be safe OR priced-in
      v3.5: extreme FRM = could be best OR over-crowded
      v4 ARS: high uncertainty = could be danger OR opportunity

      Every signal that identifies extremes catches BOTH risk and
      opportunity. No single signal can separate them. This is not
      a model failure - it is a market property:

        Extreme states are where risk and opportunity COEXIST.
