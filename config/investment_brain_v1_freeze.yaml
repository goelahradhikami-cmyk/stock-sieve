        vol_20d: "REAL"
        breadth: "REAL"
        trend_ma60: "REAL"
        recovery_prob: "REAL"
        # Failure classification (from Exp0C)
        failure_type: "TEXT (NULL if success, else taxonomy code)"
        # Metadata
        created_at: "TIMESTAMP"

      note: "This is a VIEW on shadow_episode + shadow_outcome, not a new table. But the counterfactual fields require new computation."

    # ═══════════════════════════════════════════════════════════
    # Counterfactual Coverage (frozen requirement)
    # ═══════════════════════════════════════════════════════════
    counterfactual_coverage:
      why_critical: |
        Exposure Controller optimizes "signal -> position", NOT
        "signal -> buy/not-buy". It must know: is low exposure better
        than zero exposure? Is zero exposure better than full exposure?

        Without counterfactuals:
          - BUY episodes tell us "what happened when we acted"
          - BLOCK episodes tell us NOTHING (no outcome recorded)
          - We cannot compute "cost of inaction"

        With counterfactuals:
          - Every BLOCK episode has "what would have happened if we bought"
          - Every BUY episode has "what would have happened if we didn't"
          - Exposure Controller can optimize across the full decision space

      required_for:
        - "Confidence Calibration (Exp0B) - needs BLOCK outcomes for comparison)"
        - "Exposure Engine (Phase 2) - needs counterfactual cost of inaction"
        - "Failure Taxonomy (Exp0C) - needs to know if BLOCK would have been correct)"

    # ═══════════════════════════════════════════════════════════
    # Error Cost Calibration (Exp0B refinement)
    # ═══════════════════════════════════════════════════════════
    exp0b_refinement: |
      Exp0B should NOT ask: "Can confidence predict return?"
      Exp0B SHOULD ask: "Can confidence predict ERROR COST?"

      These are different questions. Example:
        Confidence 90%: return +8%, max DD -8%
        Confidence 50%: return +4%, max DD -25%

      Return difference is small (4pp). But DD difference is large (17pp).
      For Exposure Controller, the DD matters more - it determines
      position sizing.

      Exp0B expanded metrics (at N>=100):
        - confidence -> mean return (basic)
        - confidence -> win rate (basic)
        - confidence -> max drawdown (TAIL RISK)
        - confidence -> tail loss (5th percentile return)
        - confidence -> recovery time (days to recover from DD)

      Exposure Controller cares about TAILS, not means. A confidence
      score that predicts drawdown but not return is still extremely
      valuable for position sizing.

    # ═══════════════════════════════════════════════════════════
    # Timing Attribution (Exp0D refinement)
    # ═══════════════════════════════════════════════════════════
    exp0d_refinement: |
      Exp0D decomposes: portfolio_return = beta + alpha.
      For v4.0, expand to TIMING ATTRIBUTION:

        Total Return = Market Direction + Recovery Timing + Selection + Allocation

      Since Selection is dead (6-S.18.0), focus on:
        - Market Direction (beta): what the market did anyway
        - Recovery Timing: the alpha from WHEN Guardian entered
        - Allocation: the alpha from HOW MUCH was deployed

      Example:
        Market: +10%
        Guardian: +18%
        Decomposition: beta +10%, early entry +6%, allocation +2%

      Future Exposure Engine optimizes the +6% (timing value) and +2%
      (allocation value). The +10% beta is free market exposure.

    # ═══════════════════════════════════════════════════════════
    # v4.0 Final Architecture (frozen, complete)
    # ═══════════════════════════════════════════════════════════
    v4_0_final_architecture: |
      Market Data
          v
      Market Guardian (find opportunity windows)
          v
      Recovery State Model (understand environment)
          v
      Confidence Calibration (know own reliability)
          v
      Exposure Controller (decide bet size)
          v
      Bayesian Portfolio (execute)
          v
      Return Stream

      NOTE: There is NO Stock Ranker. This empty space is the result
      of the complete v2-v3.5 falsification chain. It is not a gap
      to fill - it is a proven boundary.

      The system manages PREDICTOR UNCERTAINTY, not predictions.
      Edge = "bet less when wrong, bet more when right".

    # ═══════════════════════════════════════════════════════════
    # Evidence Level Hierarchy (frozen, the quality control system)
    # ═══════════════════════════════════════════════════════════
    evidence_hierarchy: |
      The system now has explicit evidence levels (Constitution Rules 6+7):

        Discovery      -> observed pattern, small N, NO architecture action
        Replication    -> pattern holds in independent sample
        OOS Validation -> pattern holds in holdout period (2025-2026)
        Stability      -> pattern holds across time splits and regimes
        Explanation    -> economic mechanism identified (AFTER stability)
        Architecture   -> written to genome, allowed in production

      v3's failure: Discovery -> Explanation -> Architecture (skipped steps)
      v4's discipline: Discovery -> Replication -> OOS -> Stability -> Explanation -> Architecture

      Current status of findings:
        Guardian timing alpha (1204 episodes, P<=0=0.00%): STABILITY (v1.1)
        Guardian 39.5% alpha share (N=8): DISCOVERY (cannot advance)
        FRM direction gate (+2.52% group alpha): STABILITY (v3.2.1)
        Mid×Mid: FALSIFIED (Discovery -> Replication FAILED at N=194)
        Stock selection (all candidates): FALSIFIED (complete chain)

    # ═══════════════════════════════════════════════════════════
    # Prohibited (extends all prior)
    # ═══════════════════════════════════════════════════════════
    prohibited:
      no_research_on_incomplete_ledger: "MUST NOT draw conclusions from incomplete outcome data (Rule 7)"
      no_stock_selection: "PERMANENT (6-S.18.0)"
      no_architecture_on_discovery: "MUST NOT build architecture on Discovery-level evidence (Rule 6)"
