# mypy configuration for stock-sieve
# Lenient baseline — tighten gradually as type coverage improves.

[mypy]
python_version = 3.10
namespace_packages = True
ignore_missing_imports = True

warn_unused_ignores = False
warn_redundant_casts = False
check_untyped_defs = False
disallow_untyped_defs = False
disallow_untyped_calls = False

# Exclude paths not yet typed
exclude = (?x)(
      ^tests/
    | ^migrations/
    | ^scripts/
    | ^preview_child\.py
  )

# Third-party libs without type stubs
[mypy-mootdx.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-akshare.*]
ignore_missing_imports = True

[mypy-stockstats.*]
ignore_missing_imports = True

[mypy-litellm.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True
