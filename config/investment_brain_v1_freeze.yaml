    # Confidence Redefined (the paradigm shift)
    # ═══════════════════════════════════════════════════════════
    confidence_redefinition: |
      6-S.19.5 proved Guardian confidence IS calibrated (+33pp, N=111).
      This changes confidence from a 'decoration score' to a META-SIGNAL:

        Object level:  predict the market (Guardian BUY/BLOCK signal)
        Meta level:    predict whether the prediction is reliable (confidence)

      This is NOT 'I think the market will rise, so buy X%'.
      It IS: 'I think my judgment is X% reliable, so take X% risk'.

      The difference between a trading system and an investment management
      system. Trading systems: Signal -> Position.
      Investment systems: Signal -> Confidence -> Risk Budget -> Position.

      Stock Sieve's core asset (if OOS passes) will NOT be:
        'predicting returns'
      It WILL be:
        'predicting its own reliability'

      This is closer to top asset management institutions than any alpha
      factor could be.

    # ═══════════════════════════════════════════════════════════
    # Three Risks (identified, NOT yet resolved)
    # ═══════════════════════════════════════════════════════════
    three_risks:
      risk_1_temporal_leakage:
        description: "confidence might use future information, inflating calibration"
        test: "verify all confidence inputs have timestamp <= decision timestamp"
        frozen_as: "Constitution Rule 8 (below)"
        status: "UNRESOLVED - must verify before OOS"

      risk_2_q4_gt_q5_saturation:
        description: "Q4 (86.4%) > Q5 (73.9%) - possible extreme confidence saturation"
        interpretation: |
          DO NOT 'fix' this by adjusting the model. PRESERVE and INVESTIGATE.
          This may reveal 'Extreme Confidence Trap':
            confidence 55-60% = optimal (Q4, 86.4% win)
            confidence >80% = saturation (Q5, 73.9% win)

          Possible causes:
            - crowding recovery (everyone sees the same signal)
            - market overheating (consensus trap)
            - overconfidence at extremes

          This is ANOTHER inverted-U (confidence -> reliability), consistent
          with the v3 chain finding: 'extremes are dangerous, middle is best'.
          But this time it's not alpha - it's META-reliability.
        frozen_as: "High Confidence Saturation Effect (DISCOVERY, preserve Q4>Q5)"
        action: "monitor at larger N, do NOT tune away"

      risk_3_panic_over_blocking:
        description: "Guardian BLOCK correct only 38.6% in PANIC (market recovers 61.4%)"
        interpretation: |
          Guardian's biggest problem is NOT 'not knowing recovery'.
          It IS 'panic-induced over-conservatism':
            price drops -> risk indicators worsen -> Guardian blocks
            -> market starts recovering -> Guardian missed the bottom

          Classic risk-model failure: dying at the lowest point.
          (2008, 2020, 2022 - many risk models failed at the bottom)
        frozen_as: "PANIC Failure Mode (DISCOVERY)"
        architectural_implication: |
          Exposure Controller CANNOT simply do:
            confidence low -> reduce position
          It MUST add regime override:
            PANIC: + recovery allowance (increase exposure despite low conf)
            STABILIZING: normal
            CONFIRMED: full

    # ═══════════════════════════════════════════════════════════
    # Constitution Rule 8 (frozen)
    # ═══════════════════════════════════════════════════════════
    constitution_rule_8:
      name: "Temporal Purity"
      rule: |
        Any confidence feature MUST have timestamp <= decision timestamp.
        No future information (subsequent prices, earnings revisions,
        later market states) may enter confidence computation.

      validator: |
        For each episode, audit confidence inputs:
          signal_timestamp = episode trade_date
          for each input feature in confidence computation:
            assert feature.timestamp <= signal_timestamp
          if any violation -> REJECT episode from calibration analysis

      full_constitution_rules:
