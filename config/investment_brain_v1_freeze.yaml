        - Reflexivity explanation: HYPOTHESIS (no causal proof)

      Per Constitution Rule 6, this is at UNIFYING HYPOTHESIS level:
        multiple observations suggest a pattern, but the pattern has
        not been independently replicated across all dimensions.

      It CANNOT be called 'Market Law' until:
        1. Q5<Q4 confirmed in OOS (Exp0E-2)
        2. Q5<Q4 confirmed across regimes (Exp0E-3)
        3. Q5<Q4 confirmed across time (Exp0E-1)
        4. Economic mechanism identified (reflexivity or alternative)

      Until then, it remains the most ATTRACTIVE unifying hypothesis
      in the Stock Sieve chain, but not an actionable rule.

    # ═══════════════════════════════════════════════════════════
    # The Optimization Target Shift (frozen)
    # ═══════════════════════════════════════════════════════════
    optimization_target_shift: |
      The deepest change in v4.0 is NOT a new model. It is the shift
      in optimization target:

        v2-v3.5: maximize Return Prediction (f(X) -> return)
        v4.0:    maximize Decision Quality under uncertainty
                 (f(X) -> prediction + g(history) -> trust + h(risk) -> capital)

      Traditional quant: factor -> predicted return -> buy
      Stock Sieve v4:   prediction + reliability + loss distribution
                        -> capital allocation

      This is the shift from Return Function to Decision Function.
      A CIO doesn't just ask 'will it go up?' They ask:
        'In similar past situations, when I said it would go up,
         what actually happened? If I was wrong, how wrong?
         Is this a historically deceptive environment?'

    # ═══════════════════════════════════════════════════════════
    # Corrected Final Status (frozen)
    # ═══════════════════════════════════════════════════════════
    corrected_final_status:
