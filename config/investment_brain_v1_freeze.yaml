  v4_0_asymmetric_confidence_contract:
    freeze_date: "2026-07-22"
    commit: "6-S.20.2"
    tag: "stock-sieve-v4.0-asymmetric-confidence"
    scope: "Asymmetric Confidence Reframing - BUY confidence retired, BLOCK confidence = Avoidance Risk Filter candidate, Gate 1.5 design"
    freeze_status: "CONTRACT FROZEN (confidence split into two variables: BUY-retired, BLOCK-candidate; route A+B chosen, C rejected)"

    # ═══════════════════════════════════════════════════════════
    # Route Decision (A+B, not C)
    # ═══════════════════════════════════════════════════════════
    route_decision: |
      Chosen: A (expand evidence) + B (redefine confidence scope).
      Rejected: C (stop exploring).

      Gate 1 FAIL did NOT falsify v4.0's core idea. It falsified a
      STRONGER assumption:
        ❌ 'Confidence is a unified meta-signal managing both entry and exit risk.'

      But it left a WEAKER, more valuable hypothesis:
        ✅ 'Guardian's confidence may be an Asymmetric Risk Signal:
            it knows when NOT to trust an opportunity.'

      This is a different asset. Not 'I know when I'll make money'
      but 'I know when not to make a big mistake.' The latter is
      more stable and closer to how top asset managers actually work.

      C is rejected because it would discard the BLOCK +33.9pp finding
      (high conf 71.2% vs low conf 37.3%). This is a discovered boundary
      capability. Stopping would violate Belief Audit: don't discard
      evidence, narrow the hypothesis.

    # ═══════════════════════════════════════════════════════════
    # Confidence Split (frozen)
    # ═══════════════════════════════════════════════════════════
    confidence_split:
      confidence_buy:
        status: "RETIRED"
        evidence: "Gate 0.5: delta = +0.0pp (high=low=75%, zero discrimination)"
        definition: "Predicts quality of buying opportunities"
        prohibition: "MUST NOT use BUY confidence for exposure increase. Permanent."
        interpretation: "Guardian does not know when its BUY signals are reliable. BUY is a binary gate, not a calibrated signal."

      confidence_block:
        status: "DISCOVERY (Asymmetric Risk Signal candidate)"
        evidence: "Gate 0.5: delta = +33.9pp (high 71.2% vs low 37.3%)"
        definition: "Predicts ability to AVOID bad bets (not to find good ones)"
        renamed_to: "Avoidance Confidence"
        caveat: "Exp0E-1 showed 2026 reversal (-50pp). BLOCK calibration is also unstable at current N. Cannot be used for capital yet."
        interpretation: "Guardian may know when NOT to act. This is a narrower but more realistic self-knowledge."

    # ═══════════════════════════════════════════════════════════
    # Architectural Redefinition (frozen)
    # ═══════════════════════════════════════════════════════════
    architecture_redefinition: |
      OLD (6-S.19.7): Confidence -> Exposure Controller (position sizing)
      NEW (6-S.20.2): Avoidance Confidence -> Risk Filter (exposure constraint)

      NOT: confidence high -> increase position (trading)
      BUT: avoidance confidence high -> prevent over-allocation (risk control)

      The role shifts from 'how much to bet' to 'how much to LIMIT betting'.

      Architecture (revised):
        Guardian
           |
           +--- BUY signal (binary gate, no confidence scaling)
           |
           +--- Avoidance Confidence (risk filter candidate)
                    |
                    v
              Risk Filter (constrains max exposure)
                    |
                    v
              Static Bayesian Portfolio

      Note: Static allocation, NOT dynamic. Avoidance Confidence constrains
      the UPPER BOUND, not the exact position. If avoidance confidence is
      low, max exposure is reduced. If high, normal allocation proceeds.

    # ═══════════════════════════════════════════════════════════
    # Gate 1.5: Avoidance Calibration Test (frozen design)
    # ═══════════════════════════════════════════════════════════
    gate_1_5_avoidance_calibration:
      purpose: "Test whether Avoidance Confidence (BLOCK-only) can reduce errors"
      replaces: "Gate 1 (which tested unified confidence - failed)"

      three_tests:
        test_1_avoided_loss:
