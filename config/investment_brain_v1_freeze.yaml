    # ═══════════════════════════════════════════════════════════
    # The Terminal Test (frozen)
    # ═══════════════════════════════════════════════════════════
    terminal_test: |
      The ultimate question for Stock Sieve is NOT:
        'Can it predict the market correctly?'

      It IS:
        'Does it know when to reduce its bets?'

      This is the difference between all great asset management systems
      and ordinary prediction models. Stock Sieve doesn't need to prove
      it is always right. It needs to prove it knows when it might be
      wrong, and acts on that knowledge by reducing exposure.

      Gate 1 tests: does it know when it might be wrong? (self-knowledge)
      Gate 2 tests: does it act on that knowledge? (capital translation)

      Both must pass for the IOS to be real.

