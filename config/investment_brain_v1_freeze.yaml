# ═════════════════════════════════════════════════════════
# Investment Brain Layered Architecture (v1.1)
# ═════════════════════════════════════════════════════════

investment_brain_layers:
  layer_1_market_guardian:
    status: "FROZEN v1.1 (2026-07-21)"
    rating: "★★★★★"
    validation: "6-S.11.2 Regime Transfer PASS + 6-S.11.3 Bootstrap PASS"
    responsibility: "Market-layer risk defence (BUY/BLOCK decision)"
    code: "src/thesis/state_transition.py, src/thesis/confidence_overlay.py"
    key_finding: "Timing Intelligence is independently valuable"

  layer_2_security_analyst:
    status: "DIAGNOSTIC_ONLY - v2 reconstruction complete, NOT frozen (residual_alpha negative)"
    production: false
    rating: "★★☆☆☆"
    responsibility: "Stock selection layer ('what to buy')"
    v2_reconstruction:
      commit: "6-S.12"
      date: "2026-07-21"
      tag: "security-analyst-v2-diagnostic"
      freeze_status: "NOT FROZEN - diagnostic baseline only (residual_alpha target not met)"
      components:
        - "6-S.12.1: Recovery Beta Decomposition (market_beta + sector_beta + residual_alpha)"
        - "6-S.12.2: Fundamental Recovery Layer (FRM Score, earnings_yoy revision proxy)"
        - "6-S.12.3: Sector Confirmation Layer (relative strength vs sector)"
        - "6-S.12.4: Portfolio Construction Validation (shadow_portfolio_construction table)"
        - "6-S.12.5: v2 replay comparison vs v1"
      v2_results:
        residual_alpha_v1: "-5.71% mean (18.2% positive)"
        residual_alpha_v2: "-5.01% mean (16.7% positive)"
        improvement: "+0.70pp (marginal, still negative)"
        frm_direction_v1: "61% deteriorating stocks selected"
        frm_direction_v2: "67% improving stocks selected"
        interpretation: "V2 corrected the direction (improving vs deteriorating) but residual_alpha remains negative. The anomaly detection itself may be the binding constraint, not the scoring layer."
      validation_targets:
        buy_alpha_target: ">+2%"
        buy_alpha_v2: "+4.50% (improved from +4.30%, but mostly market beta)"
        residual_alpha_target: ">0"
        residual_alpha_v2: "-5.01% (NOT MET)"
      verdict: "CONDITIONAL - V2 improves direction but does not produce positive true selection alpha. Anomaly detection redesign (v3) may be needed."
    known_issues:
      - "Doctrine shuffle showed no incremental alpha (6-S.9)"
      - "G4-B: 3/133 selection leaks (alpha<0) during recovery BUYs"
      - "2025-08-13 selected only 1 stock (diversification failure, now tracked in shadow_portfolio_construction)"
      - "V2 residual_alpha still negative (-5.01%) - anomaly detection itself may be flawed"
      - "V1 systematically selected deteriorating stocks (61%); V2 corrected to 67% improving but alpha still negative"
    next_step: "Security Analyst v3: redesign Candidate Generator (not scoring layer). See v3_roadmap below."

    v3_roadmap:
      commit: "6-S.13 (planned)"
      diagnosis: |
        v2 proved the problem is candidate generation, not scoring.
        MarketAnomalyDetector's implicit assumption is:
          drawdown + cheap + fundamentals not broken = mispriced opportunity
        But in recovery markets this often fails because many stocks are
        'deservedly cheap' (earnings deterioration + industry decline +
        capital outflow), not mispriced. V2's FRM improved direction
        (61% deteriorating -> 67% improving) but residual_alpha stayed
        negative (-5.01%), confirming the candidate pool itself lacks alpha.
      architecture: "Three-stage funnel (replaces single anomaly score)"
      stage_1_recovery_eligibility_gate:
        purpose: "Does the stock have the right to participate in recovery?"
        gates:
          - "Earnings acceleration > 0 (earnings_yoy improving, not just high)"
          - "FRM direction = improving (v2 proved this filters deteriorating stocks)"
          - "Kill criteria (frozen, retained from v1)"
      stage_2_relative_strength_confirmation:
        purpose: "Is the stock actually leading, not just riding sector beta?"
        filters:
          - "Relative strength = stock_return - sector_return > 0"
          - "Sector strength = sector_return - market_return (sector leading market)"
          - "Replaces drawdown as primary filter (drawdown finds cheap, RS finds strong)"
      stage_3_mispricing_detection:
        purpose: "Is the stock cheap AFTER passing recovery + strength gates?"
        filters:
          - "Valuation gap (retained from anomaly detector, but as last gate not first)"
          - "Divergence score (business_strength - market_pessimism)"
      phased_targets:
        v3_1: "FRM improving rate > 85% (from v2's 67%)"
        v3_2: "residual_alpha > -2% (from v2's -5.01%)"
        v3_3: "residual_alpha > 0 (true selection alpha)"
      principle: "Do NOT let Security Analyst break Market Guardian. Three intelligence layers stay permanently separated: Market / Security / Portfolio."

  layer_3_portfolio_construction:
    status: "DIAGNOSTIC ACTIVE - shadow_portfolio_construction table populated"
    rating: "★☆☆☆☆"
    responsibility: "Portfolio layer ('how much to bet')"
    note: "Bayesian Allocation frozen; shadow_portfolio_construction table (6-S.12.4) tracks concentration failures independently. 4/8 BUY episodes with selected stocks FAIL diversification gates."
    v2_findings:
      - "4/8 BUY episodes FAIL diversification (min_positions<5, concentration>25%, or sector>40%)"
      - "2025-08-13: FAIL_MIN_POSITIONS+FAIL_CONCENTRATION+FAIL_SECTOR (1 stock, 100% weight)"
      - "Portfolio layer failures isolated from selection layer failures via independent table"

# Key architectural insight (v1.1): Timing Intelligence != Selection Intelligence.
# Market Guardian proved the former can produce value independently.
# The selection layer is now the binding constraint on system alpha.

# ═════════════════════════════════════════════════════════
# Evolution v4 Constraints
# ═════════════════════════════════════════════════════════

evolution_v4:
  status: disabled
  enabled_after: "security_analyst_reconstruction_v2"
  # Evolution v4 was originally gated on shadow_trading_30_episodes.
  # That target is now far exceeded (1204 episodes). v1.1 re-gates
  # Evolution v4 on the Security Analyst reconstruction, because
  # optimising Market Guardian further has diminishing returns while
  # the selection layer remains the binding constraint.
  
  # What Evolution CAN optimize
  search_space:
    - "confidence weights (vol/trend/breadth)"
    - "confidence threshold"
    - "anomaly detection parameters"
    - "state transition rules"
    - "kill criteria thresholds"
  
  # What Evolution CANNOT touch
  frozen:
    - "doctrine underwriting logic"
    - "belief audit framework"
    - "thesis ledger schema"
    - "investment memory 4-state model"
  
  # Fitness function (NOT raw return)
  fitness:
    target: "risk_adjusted_decision_quality"
    components:
      alpha: 0.40
      downside_protection: 0.30
      false_recovery_avoidance: 0.20
      opportunity_capture: 0.10

# ═════════════════════════════════════════════════════════
# Shadow Trading Protocol
# ═════════════════════════════════════════════════════════

shadow_trading:
  status: "FROZEN v1.1 (episode accumulation goal achieved)"
  goal: "episode_accumulation (not return validation)"
  min_episodes: 30
  achieved_episodes: 1204
  achieved_date_range: "2021-08-11 to 2026-07-10"
  min_market_coverage:
    bull: 5
    bear: 10
    sideway: 10
    recovery: 5

  # Prohibited during shadow trading
  prohibited:
    - "parameter tuning"
    - "human intervention in decisions"
    - "evolution optimization"

  # Episode = one Market Guardian directional decision
  episode_definition: "state + confidence + decision + outcome"

  # Counterfactual required for every BLOCK
  counterfactual: true

