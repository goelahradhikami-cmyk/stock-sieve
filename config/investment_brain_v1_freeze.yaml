      verdict: "INCONCLUSIVE - MMM N per year is 0-2, cannot assess stability"

    # ═══════════════════════════════════════════════════════════
    # Hypothesis Verdicts
    # ═══════════════════════════════════════════════════════════
    hypothesis_verdicts:
      H3_1_alpha_island:
        verdict: "WEAKLY SUPPORTED"
        evidence: "MMM alpha=+3.00% > 0, and '2+ middle' aggregate (N=15) +5.53% is robust"
        caveat: "MMM N=3 is too small. The '2+ middle' regional definition is more reliable."
      H3_2_extreme_danger:
        verdict: "SUPPORTED"
        evidence: "HHH alpha=-1.03% < MMM +3.00%. All-high is danger, confirming market over-prices certainty."
      H3_crowding_control:
        verdict: "INCONCLUSIVE (data gap)"
        evidence: "market_cap control inconclusive (N_mmm=1/tercile). volume_ratio and relative_strength unavailable for Group A."
        implication: "Cannot rule out crowding artifact. H3 is NOT fully validated."

    # ═══════════════════════════════════════════════════════════
    # What Exp8 Proved
    # ═══════════════════════════════════════════════════════════
    what_exp8_proved:
      - "All-high (HHH) is DANGER (alpha -1.03%), confirming extremes are risk"
      - "'2+ middle dimensions' aggregate (N=15, +5.53%) outperforms '2+ extremes' (N=41, +1.41%) by +4.12pp"
      - "Mid FRM + Mid Gap is the strongest 2D combination (N=8, +8.43%, 75% positive)"
      - "The Alpha Island is a REGION (2+ middle), not a single cell (MMM N=3 too sparse)"
      - "H3-2 (extreme danger) is supported: HHH negative, worst cell HHM -13.69%"

    what_exp8_did_not_prove:
      - "H3 is NOT fully validated - crowding control incomplete (data gap)"
      - "MMM cell has N=3 - cannot distinguish Alpha Island from noise"
      - "Cannot rule out that middle-zone alpha is just 'avoiding crowded trades'"
      - "Time stability inconclusive (MMM N per year = 0-2)"

    # ═══════════════════════════════════════════════════════════
    # Frozen Decision (NOT a paradigm shift - yet)
    # ═══════════════════════════════════════════════════════════
    frozen_decision: |
      DO NOT paradigm-shift to Uncertainty Asymmetry Detector YET.

      The evidence is PROMISING but NOT sufficient:
        + H3-1 (Alpha Island exists): weakly supported (MMM +3.00%, but N=3)
        + H3-2 (extremes are danger): supported (HHH -1.03%)
        - H3 crowding control: INCONCLUSIVE (data gap)

      The '2+ middle' regional finding (N=15, +5.53%) is the most robust
      signal, but without crowding controls it could be:
        (a) genuine uncertainty premium (H3 true), OR
        (b) crowding avoidance (middle = less traded, not uncertainty)

      These are economically different and require different architectures.
      Building v3.6 on an un distinguished signal would repeat the
      v3.3/v3.4 black-box optimization error.

      REQUIRED before any paradigm shift:
        1. Backfill volume_ratio and pre-decision momentum for Group A
           (independent of Stage 2 RS), so crowding control can run
        2. Extend the universe to increase MMM cell N (currently 3)
        3. Re-run exp8 with complete controls and larger N
        4. Only if MMM/2+middle alpha SURVIVES crowding control: paradigm shift

    # ═══════════════════════════════════════════════════════════
    # Frozen Diagnostic Rules
    # ═══════════════════════════════════════════════════════════
    frozen_diagnostic_rules:
      all_high_is_danger: "HHH (all-high) alpha = -1.03%. All-high on gap+sustainability+FRM is a RISK signal."
      middle_region_alpha: "'2+ middle dimensions' (N=15, +5.53%) outperforms '2+ extremes' (N=41, +1.41%) by +4.12pp"
      mid_frm_mid_gap_strongest: "Mid FRM + Mid Gap (N=8, +8.43%, 75% positive) is the strongest 2D combination"
      alpha_island_is_regional: "The Alpha Island is a REGION (2+ middle), not a single MMM cell (N=3 too sparse)"
      crowding_control_required: "Any operationalization of H3 MUST pass crowding control (market_cap + turnover + momentum) first"

    # ═══════════════════════════════════════════════════════════
    # Sample Size Constraint (critical limitation)
    # ═══════════════════════════════════════════════════════════
    sample_size_constraint: |
      The fundamental limitation: Group A has N=60, intersecting with all
      three dimensions gives N=56, and the MMM cell has N=3. A 3x3x3 cube
      on N=56 averages ~2 per cell. This is fundamentally underpowered for
      3D analysis.

      The '2+ middle' aggregate (N=15) is more statistically meaningful,
      but still small. The 4.12pp delta vs '2+ extremes' is promising but
      not conclusive.

      Before any v3.6 design, the candidate universe MUST be expanded:
        - Extend backfill to more episodes (currently 2023-2024 dominated)
        - Consider including Group C (rs_data_available=1) stocks with
          sustainability data, broadening to N=194
        - Target N>=200 for the MMM/2+middle cell to reach statistical power

    next_phase: "v3.5 data expansion: backfill volume_ratio + pre-decision momentum for Group A, extend universe to N>=200, re-run exp8 with complete crowding controls"

  v3_5_1_mechanism_identification_freeze:
    freeze_date: "2026-07-21"
    commit: "6-S.17.3"
    tag: "security-analyst-v3.5.1-mechanism-identification"
    scope: "Mechanism Identification - distinguish uncertainty premium from crowding avoidance"
    freeze_status: "DESIGN FROZEN (mechanism fork point - H3-A vs H3-B)"
    production: false

    # ═══════════════════════════════════════════════════════════
    # Why v3.5.1 (not v3.6, not data expansion)
    # ═══════════════════════════════════════════════════════════
    design_rationale: |
      Exp8 advanced the question from 'does FRM work?' to 'what is the
      alpha MECHANISM?'. The middle-uncertainty zone has alpha (N=15,
      +5.53%), but two economically distinct explanations fit the data:

        H3-A: Uncertainty Asymmetry Premium
              Market cannot form consensus on moderate-signal stocks.
              Information asymmetry creates alpha. Architecture implication:
              SELECT for uncertainty zone (moderate signals).

        H3-B: Crowding Avoidance Premium
              Extreme stocks are hot/event/over-traded. Middle stocks are
              less crowded. Alpha comes from avoiding crowded trades, not
              from uncertainty. Architecture implication: SELECT for low
              crowding (regardless of signal moderation).

      These require DIFFERENT architectures. Building v3.6 on an
      undistinguished mechanism would repeat the v3.3/v3.4 black-box
      optimization error. v3.5.1 is NOT data expansion - it is a
      mechanism identification experiment with a clear fork decision.

      This is the most critical fork point in the entire Stock Sieve
      falsification chain. The question is no longer 'what signal
      works?' but 'WHY does the market fail to price these stocks?'.

    # ═══════════════════════════════════════════════════════════
    # Current State (frozen snapshot)
    # ═══════════════════════════════════════════════════════════
    current_state:
      market_guardian: "★★★★★ TIMING CONFIRMED (v1.1 frozen, 1204 episodes)"
      frm_recovery_direction: "★★★★ DIRECTION ALPHA CONFIRMED (+2.52%, v3.2.1)"
      frm_score: "❌ NOT a quality score (Exp1: Q5 worst alpha, inverted-U)"
      frm_score_redefined: "✅ UNCERTAINTY INDICATOR CANDIDATE (not quality)"
      uncertainty_zone: "+ evidence (4 signals inverted-U), - mechanism unresolved"
      mechanism_fork: "H3-A (uncertainty premium) vs H3-B (crowding avoidance) - NEXT"

    # ═══════════════════════════════════════════════════════════
    # The Mechanism Fork (falsifiable)
    # ═══════════════════════════════════════════════════════════
    mechanism_fork:
      H3_A_uncertainty_premium:
        claim: "Alpha comes from information asymmetry. Market cannot form consensus on moderate-signal stocks because information is genuinely ambiguous."
        test: "Uncertainty zone alpha SURVIVES controlling for crowding. The coefficient on uncertainty_zone is positive and significant after crowding controls."
        architecture_implication: "Uncertainty Asymmetry Detector - SELECT for moderate signals (the zone where market is uncertain)"
        if_true: "Paradigm shift: Security Analyst finds stocks the market cannot price, not stocks with best recovery."
      H3_B_crowding_avoidance:
        claim: "Alpha comes from avoiding crowded trades. Extreme-signal stocks are hot/event/over-traded. Middle stocks are simply less crowded."
        test: "Uncertainty zone alpha DISAPPEARS when crowding is controlled. The coefficient on crowding is significant; uncertainty_zone becomes insignificant."
        architecture_implication: "Crowding Filter - SELECT for low crowding (regardless of signal moderation). Uncertainty zone was a proxy for low crowding."
        if_true: "No paradigm shift. Add crowding filter to existing FRM direction gate. Security Analyst stays as Recovery Direction Detector + crowding avoidance."

    # ═══════════════════════════════════════════════════════════
    # Crowding Vector Definition (frozen)
    # ═══════════════════════════════════════════════════════════
    crowding_vector:
      design_principle: |
        RS (relative strength) is DEMOTED as a gate (v3.2.2) but RS-like
        measures are REHABILITATED as crowding DIAGNOSTICS (not gates).
        The distinction:
          WRONG (v3.2.2 disproved): RS_high -> BUY (RS as alpha signal)
          RIGHT (v3.5.1): RS_high -> possibly_crowded (RS as crowding diagnostic)
        The crowding vector measures how much attention/flow a stock has
        received, NOT whether it will go up.

      features:
        momentum_crowding:
          return_20d: "trailing 20-day return (short-term momentum, crowding proxy)"
          return_60d: "trailing 60-day return (medium-term momentum)"
          interpretation: "High momentum = market has already noticed = crowded"
          data_source: "TDX kline via LocalDataProvider (same as event_reaction.py)"
          vintage_safe: "computed from prices BEFORE trade_date (no lookahead)"

        liquidity_crowding:
          turnover_percentile: "cross-sectional turnover percentile at trade_date"
          volume_ratio: "current_volume / avg(volume, 20d) - abnormal volume spike"
          interpretation: "High turnover/volume = market attention = crowded"
          data_source: "TDX kline volume + finance_snapshots float_mcap for turnover"
          vintage_safe: "computed from volume BEFORE trade_date"

        volatility_crowding:
          realized_vol_20d: "20-day realized volatility (std of daily returns)"
          interpretation: "High vol = event-driven attention = potentially crowded"
          data_source: "TDX kline via LocalDataProvider"
          vintage_safe: "computed from prices BEFORE trade_date"

        attention_crowding:
          abnormal_volume: "(current_volume - avg_20d) / std_20d - volume spike z-score"
          price_gap: "absolute daily return on trade_date (event-driven attention)"
          interpretation: "Volume spike / price gap = sudden attention = crowded"
          data_source: "TDX kline"
          vintage_safe: "computed from data ON or BEFORE trade_date"

      composite: "crowding_score = zscore(turnover_pct) + zscore(return_20d) + zscore(realized_vol_20d) + zscore(abnormal_volume) - NOT a gate, a CONTROL variable"

    # ═══════════════════════════════════════════════════════════
    # Three Experiments (frozen design)
    # ═══════════════════════════════════════════════════════════
    experiments:
      exp9_alpha_attribution_regression:
        purpose: "THE CRITICAL TEST - does uncertainty zone alpha survive crowding controls?"
        model: "alpha = b0 + b1*uncertainty_zone + b2*crowding_score + b3*market_cap + controls"
        where_uncertainty_zone: "binary: 1 if 2+ of (FRM, gap, sustainability) in middle tercile, 0 otherwise"
        decision_rule:
          if_b1_positive_significant_and_b2_insignificant: "H3-A VALIDATED - uncertainty premium is real"
          if_b1_insignificant_and_b2_significant: "H3-B VALIDATED - alpha is crowding avoidance"
          if_both_significant: "MIXED - both mechanisms contribute; decompose further"
          if_neither_significant: "INCONCLUSIVE - alpha may be noise or regime-specific"
        data_requirement: "N>=60 (Group A) with all crowding features backfilled"
        priority: "P0 - highest"

      exp10_uncertainty_x_crowding_matrix:
        purpose: "Decompose the middle zone - is it uncertainty OR crowding OR both?"
        method: "2x2 matrix: uncertainty_zone (yes/no) x crowding_tercile (low/mid/high)"
        expected_patterns:
          H3_A_pattern: "uncertainty_yes + low_crowding = BEST; uncertainty_yes + high_crowding = still good (uncertainty dominates)"
          H3_B_pattern: "uncertainty_yes + low_crowding = BEST; uncertainty_yes + high_crowding = BAD (crowding dominates)"
          both_pattern: "uncertainty_yes + low_crowding = BEST; both factors contribute incrementally"
        cells:
          unc_yes_low_crowd: "predict: best if H3-A, best if H3-B (cannot distinguish here)"
          unc_yes_high_crowd: "CRITICAL CELL - good if H3-A, bad if H3-B"
          unc_no_low_crowd: "tests if crowding alone explains alpha"
          unc_no_high_crowd: "predict: worst in all hypotheses"
        priority: "P1"

      exp11_time_stability:
        purpose: "Verify the mechanism is stable across regimes, not a single-period artifact"
        method: "Split by time period (2023 vs 2024-2026) AND market_state (STABILIZING vs CONFIRMED_RECOVERY)"
        concern: "N=15 '2+ middle' alpha +5.53% may be concentrated in 2024 bull phase"
        required: "Alpha positive in BOTH time periods with N>=5 per period"
        failure_implication: "If alpha is regime-specific, neither H3-A nor H3-B is stable enough to operationalize"
        priority: "P2"

    # ═══════════════════════════════════════════════════════════
    # Validation Gates (frozen)
    # ═══════════════════════════════════════════════════════════
    validation_gates:
      v3_5_1_a_mechanism_identified:
        test: "Exp9 produces a clear H3-A or H3-B verdict (not INCONCLUSIVE)"
        required: "b1 or b2 significant at 5%, the other not"
        failure_implication: "If inconclusive, extend N (more episodes) before re-running. Do NOT guess."
      v3_5_1_b_mechanism_stable:
        test: "Exp11 shows alpha positive in both time periods"
        required: "alpha > 0 in 2023 AND 2024-2026 splits, N>=5 each"
        failure_implication: "Mechanism is regime-specific; do not operationalize"
      v3_5_1_c_crowding_data_complete:
