      IOS implies complete capital management capability. Current
      system does NOT have this (Exposure Controller BLOCKED, Gate 1
      failed, ARS unvalidated).

      Renamed to: Recovery Regime Risk Management System (RRMS)

      Until Gate 1.5 + subsequent validation passes, the system is
