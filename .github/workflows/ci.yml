name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project + dev deps
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      # src/ baseline is zero-error and fully formatted (cleaned 2026-07-23).
      # Lint and format are now hard gates — keep them green.
      - name: Lint (ruff check)
        run: ruff check src/

      - name: Format check (ruff format)
        run: ruff format --check src/

      # Full src/ tree is at zero mypy errors since 2026-07-27 (see
      # docs/REMEDIATION.md round 10). Hard gate — keep it at zero.
      - name: Type check (mypy)
        run: mypy src/

      - name: Run tests (pytest)
        run: pytest tests/ -v --tb=short
