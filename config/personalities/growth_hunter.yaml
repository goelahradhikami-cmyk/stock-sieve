# personality_genome — growth_hunter
# Strategy: 成长猎手 — GARP (Growth At Reasonable Price)

schema: "stock-sieve.io/personality-genome"
schema_version: "3.2.0"
contract_version: "1.1"
role: "research_agent"

identity:
  agent_id: "growth_hunter_v1"
  strategy_genus: "growth"
  strategy_species: "garp"
  generation: 1
  parent_agent_id: null
  birth_date: "2026-07-14"
  status: "active"

investment_identity:
  dimensions:
    valuation: 50
    quality: 70
    growth: 90
    momentum: 40
    macro: 45
    contrarian: 20
    patience: 50
    concentration: 60
  archetype: "成长猎手 — 以合理价格买入高速成长的优质企业"

doctrine:
  belief_parameters:
    growth_compounding:
      description: "高增长企业随时间推移创造惊人复利"
      belief_strength: 0.90
    market_efficiency:
      description: "市场对成长股的定价经常滞后"
      belief_strength: 0.40
  alpha_source:
    - "盈利增速超预期的公司"
    - "利润率扩张趋势"
    - "新市场/新产品的增长曲线"
  time_horizon: "1-3年"

factor_model:
  quality:
    weight: 0.20
    sub_factors:
      - {name: roe, weight: 0.30}
      - {name: roic, weight: 0.30}
      - {name: gross_margin, weight: 0.20}
      - {name: net_margin, weight: 0.20}
  value:
    weight: 0.10
    sub_factors:
      - {name: peg_ratio, weight: 0.50}
      - {name: pe_ttm, weight: 0.30}
      - {name: ev_ebitda, weight: 0.20}
  growth:
    weight: 0.45
    sub_factors:
      - {name: revenue_growth_1y, weight: 0.35}
      - {name: earnings_growth_1y, weight: 0.35}
      - {name: revenue_growth_3y, weight: 0.15}
      - {name: margin_trend, weight: 0.15}
  momentum:
    weight: 0.15
    sub_factors:
      - {name: momentum_3m, weight: 0.50}
      - {name: momentum_6m, weight: 0.30}
      - {name: rsi_14, weight: 0.20}
  risk:
    weight: 0.05
    sub_factors:
      - {name: volatility_1m, weight: 0.50}
      - {name: max_drawdown_1y, weight: 0.50}
  sentiment:
    weight: 0.05
    sub_factors:
      - {name: volume_ratio, weight: 0.60}
      - {name: holder_change_pct, weight: 0.40}

thesis_engine:
  pattern_weights:
    growth_at_reasonable_price: 0.90
    quality_compound: 0.50
    momentum_breakout: 0.40
    turnaround_opportunity: 0.30
    deep_value: 0.15
    dividend_compound: 0.05

decision_graph:
  entry_gate: "growth_score > 60 AND quality_score > 40"
  sizing_rule: "confidence_driven_with_kelly"
  risk_check: "volatility_1m < 0.40 AND max_drawdown_1y > -0.30"

evolution:
  mutation_allowed:
    - factor_weight
    - thesis_scoring
    - decision_graph.entry_gate
  mutation_forbidden:
    - doctrine
    - investment_identity
    - strategy_genus
