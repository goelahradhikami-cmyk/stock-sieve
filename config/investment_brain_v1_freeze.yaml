        purpose: "Re-verify Mid FRM × Mid Gap at N>=200"
        method: |
          Extend to combined Group A + Group C (N=194). For each event,
          compute FRM score bucket + Gap tercile. Re-run the 3×3 matrix.
          IMPORTANT: Group C passed RS gate, so its baseline is different.
          Must report Group A only, Group C only, and Combined separately
