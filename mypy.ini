# mypy configuration for stock-sieve
# Lenient baseline — tighten gradually as type coverage improves.

[mypy]
python_version = 3.10
namespace_packages = True
ignore_missing_imports = True

# Exclude paths not yet typed
exclude = (?x)(
      ^tests/
    | ^migrations/
    | ^scripts/
    | ^preview_child\.py
  )

warn_unused_ignores = False
warn_redundant_casts = False
# Enabled 2026-07-27 (first tightening step): function bodies of untyped defs
# are now checked. As of 2026-07-27 the full src/ tree is at ZERO mypy errors
# (five-step burn-down from the original 186 errors / 50 files — see
# docs/REMEDIATION.md).
check_untyped_defs = True
disallow_untyped_defs = False
disallow_untyped_calls = False

# ── Per-package strict tiers (2026-07-27, mypy 清零第二步) ──
# These packages are fully annotated and zero-error: disallow_untyped_defs
# is ON for them so new code must stay typed. The remaining packages are
# zero-error but not yet fully annotated; promote them incrementally (see
# docs/REMEDIATION.md).
[mypy-src.api.*]
disallow_untyped_defs = True

[mypy-src.market.*]
disallow_untyped_defs = True

[mypy-src.memory.*]
disallow_untyped_defs = True

[mypy-src.simulation.*]
disallow_untyped_defs = True

[mypy-src.paper_trading.*]
disallow_untyped_defs = True

[mypy-src.execution.*]
disallow_untyped_defs = True

# Archived research modules are historical artifacts, not maintained code
# (module-level — path-regex exclude is separator-sensitive on Windows;
# consistent with ruff.toml extend-exclude of scripts/archive)
[mypy-src.evolution.archive.*]
ignore_errors = True

[mypy-src.thesis.archive.*]
ignore_errors = True

# Third-party libs without type stubs
[mypy-mootdx.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-akshare.*]
ignore_missing_imports = True

[mypy-stockstats.*]
ignore_missing_imports = True

[mypy-litellm.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True
