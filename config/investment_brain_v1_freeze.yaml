      market_index: "market_index_daily (3592 rows, 2021-2026)"
      note: "Most features for guardian_state_snapshot are ALREADY in shadow_episode. Minimal new data work needed."

    # ═══════════════════════════════════════════════════════════
    # Phase 0 Three Experiments (frozen)
    # ═══════════════════════════════════════════════════════════
    experiments:
      exp0a_regime_conditional_reliability:
        purpose: "Build Guardian Regime Map - conditional reliability, NOT causal explanation"
        method: |
          For each of 1204 episodes, extract market features at signal time.
          Bin episodes into market environments (not predefined - data-driven).
          For each environment, compute:
            - Guardian win rate (portfolio_return_t20 > 0)
            - Mean return
            - Mean max drawdown
            - Mean alpha vs HS300
          Produce: Guardian reliability as CONDITIONAL DISTRIBUTION.
        output: "Guardian Regime Map (environment -> reliability statistics)"
        key_principle: "Describe WHERE Guardian works, NOT WHY. No causal claims."
        example_output: |
          Regime A (high vol + low valuation + earnings bottom):
            N=45, win rate 78%, mean return +18%, mean DD -8%
          Regime B (low vol + high valuation + earnings late-expansion):
            N=67, win rate 52%, mean return +3%, mean DD -12%
          -> Guardian is NOT uniformly reliable. It has environments.

      exp0b_confidence_calibration:
        purpose: "Is Guardian's confidence score calibrated to actual outcomes?"
        method: |
          Bin episodes by confidence_band (blocked/small/normal/full).
          For each bin, compute actual win rate and mean return.
          A well-calibrated confidence means:
            full band -> highest win rate, highest return
            blocked band -> lowest win rate
          If calibration is poor, confidence is NOT predictive.
        output: "Confidence Calibration Curve (predicted confidence vs actual outcome)"
        key_question: "Does Guardian's confidence predict its own reliability?"
        implication_if_calibrated: "Confidence can drive Exposure Controller (Phase 2)"
        implication_if_miscalibrated: "Confidence is noise. Need recalibration before use."

      exp0c_failure_mode_taxonomy:
        purpose: "When does Guardian FAIL? Classify failure modes."
        method: |
          Identify episodes where Guardian signaled BUY but outcome was negative
          (portfolio_return_t20 < 0 or alpha_vs_hs300 < -5%).
          Cluster by market features to find failure patterns.
          Build failure mode taxonomy (e.g. "false recovery", "liquidity trap").
        output: "Guardian Failure Mode Taxonomy"
        key_principle: "Failures are more informative than successes for risk management."
        implication: "Exposure Controller (Phase 2) can reduce exposure when failure-mode conditions appear."

    # ═══════════════════════════════════════════════════════════
    # FRM State Vector (frozen design for Phase 1)
    # ═══════════════════════════════════════════════════════════
    frm_state_vector:
      design_principle: |
        Market state is a DYNAMIC SYSTEM. Treat FRM like physics:
          level (x):     current state (FRM score)
          velocity (v):  change speed (ΔFRM per period)
          acceleration (a): change acceleration (Δ²FRM)
        Two stocks with same level but different velocity/acceleration
        have completely different meanings:
          Slow recovery: -10 -> -8 -> -6 -> -4 (velocity +2, accel 0)
          Fast recovery: -10 -> -5 -> +5 -> +15 (velocity +10, accel +5)
        Both reach +15 eventually but the DYNAMICS differ.
      three_components:
        level: "current FRM score (state value)"
        velocity: "FRM_current - FRM_previous (1st derivative)"
        acceleration: "(FRM_current - FRM_previous) - (FRM_previous - FRM_previous2) (2nd derivative)"
      phase_1_test: "Does velocity/acceleration predict regime alpha better than level alone?"
      prohibited: "MUST NOT use these as stock ranking variables (6-S.18.0). This is regime dynamics, not stock selection."

    # ═══════════════════════════════════════════════════════════
    # Exposure Controller Three-Layer Design (frozen for Phase 2)
    # ═══════════════════════════════════════════════════════════
    exposure_controller_design:
      three_layers: |
        DO NOT output position directly. Use three layers:
          1. Guardian Confidence (from Phase 0 calibration)
          2. Risk Budget (confidence -> allowed risk %)
          3. Exposure Target (risk budget -> equity allocation %)
        Example:
          Confidence 90% -> Risk Budget 80% -> Exposure 80%
          Confidence 60% -> Risk Budget 50% -> Exposure 50%
          Confidence 30% -> Risk Budget 20% -> Exposure 20%
      anti_gambling_rule: |
        NEVER: signal=1 -> all in. That turns timing alpha into gambling.
        The exposure must scale with confidence, not binary switch.
      phase_2_deliverable: "Backtested compounding curve with dynamic exposure vs static"

    # ═══════════════════════════════════════════════════════════
    # Constitution Validator - 5th Rule (frozen addition)
    # ═══════════════════════════════════════════════════════════
    constitution_validator_rule_5:
      name: "Complexity Penalty"
      rationale: |
        ALL previous failed models shared one trait: increasing complexity.
        v3.3 EGE added gap_score on top of FRM. v3.4 added sustainability.
        v3.5 added crowding + uncertainty_zone. Each added complexity
        without out-of-sample gain. Complexity without OOS gain is overfitting.
      rule: |
        Every Evolution v4 candidate MUST answer:
          "How much out-of-sample improvement does this new complexity bring?"
        If the answer is "none" or "in-sample only", REJECT.
      complexity_budget:
        max_new_parameters: 5
        required_oos_gain: true
        oos_test_period: "2025-2026 (holdout, not used in any prior experiment)"
      full_validator_rules:
        1: "Uses PROHIBITED belief? -> REJECT"
        2: "Treats state variable as ranking? -> REJECT"
        3: "Adds stock selection factor? -> REJECT"
        4: "Operates within allowed scope? -> check"
        5: "NEW: Complexity > budget OR no OOS gain? -> REJECT"

