        - "confidence (0-100, Guardian confidence)"
        - "confidence_band (blocked/small/normal/full)"
        - "market_state (PANIC/STABILIZING/EARLY_RECOVERY/CONFIRMED_RECOVERY/EUPHORIA)"
      outcomes_available:
        - "portfolio_return_t20 (T+20 equal-weight return)"
