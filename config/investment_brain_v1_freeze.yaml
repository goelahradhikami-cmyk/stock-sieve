        - v3: extreme signals catch both risk and opportunity (inverted-U)
        - v4: ARS catches both danger and opportunity (Test 1-3 vs Test 4)

      The unified pattern: the system can IDENTIFY extremes but cannot
      DIRECTIONALIZE them (risk vs opportunity). This is consistent with
      the reflexivity hypothesis (6-S.19.8): extreme states are where
      risk and opportunity coexist.

