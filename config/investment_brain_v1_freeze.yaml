          -> this is the per-stock alpha source
          -> +8.43% alpha (vs +2.52% FRM direction alone, delta +5.91pp)
          -> both dimensions contribute (Mid FRM row +4.72%, Mid Gap col +3.69%)

        Layer 3: Sustainability DEMOTED (removes alpha within Mid×Mid)
        Layer 3: Crowding not significant (Exp9)
        Layer 3: RS disproved as gate (v3.2.2)

      This is the State -> Disagreement -> Selection three-layer cognitive
      architecture that top active funds use:
        market state -> candidate universe -> cognitive error identification

      FRM does not predict returns. It defines which stocks are worth
      studying. The alpha comes from identifying WHERE within the pool
      the market's disagreement creates mispricing (Mid×Mid).

