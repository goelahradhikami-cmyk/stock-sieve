# mypy configuration for stock-sieve
# Lenient baseline — tighten gradually as type coverage improves.

[mypy]
python_version = 3.10
namespace_packages = True
ignore_missing_imports = True

warn_unused_ignores = False
warn_redundant_casts = False
# Enabled 2026-07-27 (first tightening step): function bodies of untyped defs
# are now checked. Baseline stays at 186 errors / 50 files after fixing the
# 3 annotation bugs this revealed (candidate_generator._funnel_log_buffer,
# risk_controller.ra, baostock_provider.out). See docs/REMEDIATION.md.
check_untyped_defs = True
disallow_untyped_defs = False
disallow_untyped_calls = False

# ── Per-package strict tiers (2026-07-27, mypy 清零第二步) ──
# These packages are fully annotated and zero-error: disallow_untyped_defs
# is ON for them so new code must stay typed. Expand this list package by
# package as the 186-error baseline burns down (see docs/REMEDIATION.md).
[mypy-src.api.*]
disallow_untyped_defs = True

[mypy-src.market.*]
disallow_untyped_defs = True

[mypy-src.memory.*]
disallow_untyped_defs = True

[mypy-src.simulation.*]
disallow_untyped_defs = True

# Exclude paths not yet typed
exclude = (?x)(
      ^tests/
    | ^migrations/
    | ^scripts/
    | ^preview_child\.py
  )

# Third-party libs without type stubs
[mypy-mootdx.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-akshare.*]
ignore_missing_imports = True

[mypy-stockstats.*]
ignore_missing_imports = True

[mypy-litellm.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True
