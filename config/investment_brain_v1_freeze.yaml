    # ═══════════════════════════════════════════════════════════
    # Gate 1.5: Four Tests (frozen, expanded from 3)
    # ═══════════════════════════════════════════════════════════
    gate_1_5_four_tests:
      core_question: "Does Guardian know not just 'when to buy' but 'when not to trust that buying is safe'?"

      test_1_avoided_loss:
        question: "When ARS is high (BLOCK), does market actually fall more?"
        method: "Compare counterfactual market return: high-ARS BLOCK vs low-ARS BLOCK."
        success: "high-ARS market_return < low-ARS by >= 2pp"

      test_2_regret_reduction:
        question: "Does Guardian+ARS reduce investor pain paths vs buy-everything?"
        method: |
          Compare Strategy A (buy all episodes) vs Strategy B (Guardian-filtered).
          Focus on: max drawdown, consecutive loss length, RECOVERY TIME.
          Recovery time is critical: many funds die not from -20% but
          from 5 years of no recovery.
        success: "B max_DD < A max_DD AND B recovery_time < A recovery_time"
        metrics: ["max_drawdown", "consecutive_loss_days", "recovery_time_days", "tail_events_P5"]

      test_3_crisis_robustness:
        question: "Does ARS distinguish real crisis from opportunity in PANIC/STABILIZING?"
        method: "Per-regime ARS calibration. Does high-ARS BLOCK correctly identify true danger vs false alarm?"
        success: "positive ARS delta in >= 1 crisis regime (PANIC or STABILIZING) with N >= 10"
        key_distinction: "NOT 'does PANIC make money' but 'does ARS know when PANIC is real risk vs opportunity'"

      test_4_opportunity_cost:
        question: "Does Avoidance reduce errors WITHOUT excessive sacrifice of upside?"
        method: |
          The greatest danger of risk filters is not missing bad opportunities
          but DESTROYING good ones through chronic over-caution.
          Measure: false_block_rate (blocked but market rose),
          missed_upside (mean counterfactual gain when blocked),
          tail_miss (top-decile rallies blocked).
        success: "false_block_rate < 50% AND missed_upside < overall mean return + 3pp"
        rationale: |
          If ARS blocks 80% of episodes and markets rise 60% of time,
          ARS is not risk control - it is an opportunity destroyer.
          A useful risk filter must let MOST good opportunities through
          while catching the worst ones.

      pass_rule:
        overall: ">= 3 of 4 tests pass AND no catastrophic failure in any single test"
        catastrophic_failure: "test_4 false_block_rate > 70% (destroys more opportunity than it protects)"
        evidence_if_pass: "ARS advances: Discovery -> Replication"
        evidence_if_fail: "ARS is also unstable. Accept static system (option C)."

    # ═══════════════════════════════════════════════════════════
    # Evolution v4 Anti-Overfiltering (frozen)
    # ═══════════════════════════════════════════════════════════
    evolution_anti_overfiltering:
      problem: |
        Risk-control Evolution naturally drifts toward MORE filtering.
        Higher block rate looks 'safer' in backtest but destroys
        opportunity in production. Cash ratio creeps up. Returns vanish.
        Evolution optimizes block precision while ignoring opportunity cost.
      new_prohibitions:
        - "maximize_avoidance_rate (Evolution cannot optimize for blocking more)"
        - "maximize_block_precision_only (cannot optimize precision without recall)"
      allowed_optimization_targets:
        - "regret_reduction (minimize investor pain paths)"
        - "downside_protection (reduce tail losses)"
        - "recovery_time (minimize time to recover from drawdown)"
        - "risk_adjusted_exposure (balance protection vs opportunity)"
      principle: |
        Evolution must optimize the TRADE-OFF between protection and
        opportunity, not maximize protection alone. A filter that blocks
        everything has zero risk but zero value.

