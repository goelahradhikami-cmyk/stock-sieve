# Doctrine Archetype Library - Genesis Generation 0
#
# These 12 archetypes are SEED doctrines (Generation 0), not a ceiling.
# Evolution produces hybrid doctrines beyond this library (e.g.
# compound_growth_value from value_purist × growth_hunter).
# DoctrineRegistry manages the full lifecycle: archetype | generated | extinct.
#
# Each archetype is a complete "investment philosophy DNA":
#   identity_signature  - the identity vector this doctrine naturally arises from
#   principles          - investment beliefs (semantic, for explainability)
#   factor_bias         - weights for the 6 factor families (sums to ~1.0)
#   thesis_priority     - ordered thesis patterns this doctrine prefers
#   confidence_model    - how this doctrine computes conviction
#   holding_period      - typical holding days
#   mutation_cost       - per-dimension cost weights (补丁3: weighted mutation distance)

schema: stock-sieve.io/doctrine-archetype
schema_version: 1.0.0

# The 8 identity dimensions (must match personality_genome dimensions)
identity_dimensions: [valuation, quality, growth, momentum, macro, contrarian, patience, concentration]

