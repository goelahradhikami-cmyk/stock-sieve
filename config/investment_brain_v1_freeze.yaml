    # ═══════════════════════════════════════════════════════════
    terminology_rename: |
      'Confidence' is retired as a term. It implies 'higher = more
      worth acting on', which caused the BUY misuse (6-S.20.1).

      Renamed to: Avoidance Reliability Score (ARS)

      ARS semantics:
        higher ARS = historically more reliable at AVOIDING bad entries
        NOT: higher = more worth buying

      This prevents future Evolution from re-misusing the score as a
      position sizing input. The name enforces the correct use:
        ARS high -> constrain exposure (risk filter)
        ARS low -> normal allocation (no additional constraint)

