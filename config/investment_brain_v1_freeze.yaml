      Exp9 + Exp10 together reveal the correct architecture:

      FRM is a GATE (portfolio filter), not a RANKER (per-stock predictor).
      All previous failures (RS, EGE, sustainability, high FRM) made the
      SAME error: treating a state variable as a ranking variable.

