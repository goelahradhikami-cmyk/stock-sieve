    # Exp0E-4 Calibration Half-life (frozen, 4th sub-test)
    # ═══════════════════════════════════════════════════════════
    exp0e_4_calibration_half_life:
      question: "How long does confidence calibration remain valid?"
      why_critical: |
        Financial markets' biggest enemy is not error - it is MODEL
        CAPABILITY AGING. A calibration that was +33pp in 2021 may
        decay to +10pp by 2025. If we don't know the half-life, we
        don't know when to recalibrate or reduce trust.
      method: |
        Rolling window: train on past 24 months, test on next 6 months.
        Compute calibration delta (high_conf_win - low_conf_win) for
        each test window. Track decay over time:
          2021 train -> 2022 test: delta = +30pp
          2022 train -> 2023 test: delta = +25pp
          ...
        Fit exponential decay: delta(t) = delta_0 * exp(-t / half_life)
        Output: confidence half-life in months.
      decision_rules:
        half_life_gt_24m: "Calibration is durable. No frequent recalibration needed."
        half_life_12_24m: "Moderate decay. Schedule periodic recalibration."
        half_life_lt_12m: "Fast decay. Calibration is ephemeral. May need Evolution v4 to maintain."
        no_decay: "Calibration is stable. Confidence is a durable asset."
      connects_to_evolution: "Half-life directly determines whether Evolution v4 is needed for recalibration (allowed scope: confidence_calibration)."

    # ═══════════════════════════════════════════════════════════
    # Reflexivity Hypothesis (frozen as research direction)
    # ═══════════════════════════════════════════════════════════
    reflexivity_hypothesis: |
      The Q4 > Q5 saturation effect, combined with v3 chain findings,
      suggests a unified market structure:

        ALL extreme states produce risk:
          - extreme cheapness (v2: deserved cheapness)
          - extreme quality (v3.4: sustainability removes alpha)
          - extreme disagreement (v3.3: high gap = distrust)
          - extreme recovery score (Exp1: high FRM = worst alpha)
          - extreme confidence (6-S.19.5: Q5 < Q4 reliability)

      FIVE inverted-U patterns across different dimensions. This is
      not coincidence. It may reflect a fundamental market law:

        Market is a REFLEXIVE system (Soros).
        When a state is confirmed by all participants:
          information diffuses -> trades crowd -> return space shrinks
          -> risk increases

        Extreme certainty in ANY dimension = the market has reached
        consensus = no one left to be the counterparty = risk.

      This hypothesis is NOT actionable yet (Discovery level). But it
      unifies the entire v2-v4 chain under one theoretical framework:
        Stock Sieve's edge is not in finding extremes, but in identifying
        where the market has NOT yet reached consensus (the middle zone)
        AND knowing when its own assessment is reliable (confidence).

      Future direction (if Exp0E confirms inverted-U in confidence):
        The system should SELECT for calibrated moderate confidence
        and REJECT extreme confidence (both high and low).
        This is the meta-level version of v3's 'extremes are dangerous'.

