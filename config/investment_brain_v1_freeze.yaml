    freeze_status: "EXECUTION CONTRACT FROZEN (refined from 6-S.19.0 - prevents over-attribution)"

    # ═══════════════════════════════════════════════════════════
    # Critical Refinement (from design review)
    # ═══════════════════════════════════════════════════════════
    critical_refinement: |
      6-S.19.0 asked: "WHY does Guardian work?"
      This question is DANGEROUS. It assumes Guardian has a SINGLE cause.
      Real markets don't work that way. Over-attribution risk:

        discover pattern -> give economic explanation -> write to genome
        -> increase position -> fail

      This is the SAME error pattern as v3.3/v3.4 (beautiful story,
      small sample, overfit). v4.0 must NOT repeat it with Guardian.

      REFINED question: "In WHAT ENVIRONMENTS does Guardian work/fail?"
      This produces CONDITIONAL DISTRIBUTIONS, not causal explanations.
      A regime map is empirically testable; a causal story is not.

      Output: Guardian Regime Map (conditional reliability), NOT
              Guardian Alpha Explanation (causal story).

    # ═══════════════════════════════════════════════════════════
    # Data Foundation (verified)
    # ═══════════════════════════════════════════════════════════
