    # ═══════════════════════════════════════════════════════════
    prohibited:
      no_v3_6_before_mechanism: "MUST NOT design v3.6 (Uncertainty Detector or Crowding Filter) before H3-A/H3-B is distinguished"
      no_rs_gate_rehabilitation: "MUST NOT re-add RS as a gate (v3.2.2 disproved). RS-like measures are ONLY crowding diagnostics, not alpha signals."
      no_paradigm_shift_on_inconclusive: "MUST NOT paradigm-shift on inconclusive evidence (would repeat v3.3/v3.4 black-box error)"
