# Investment Brain v1.1 Frozen Defensive Core - Freeze Manifest
# Commit 6-S.11.3 (upgraded from 6-S.10.0 on 2026-07-21)
#
# v1.0 -> v1.1 upgrade: Market Guardian passed 6-S.11.2 Regime Transfer
# and 6-S.11.3 Bootstrap Validation (1204 episodes, 10000-iteration
# bootstrap, P(defensive_alpha<=0)=0.00%). See data/reports/
# market_guardian_validation_2026-07-21.md for the full evidence chain.
#
# This file is the immutable record of what Evolution v4 will optimize.
# Any parameter change requires a new version number + re-validation.

version: "1.1-frozen-defensive-core"
freeze_date: "2026-07-21"

# ═════════════════════════════════════════════════════════
# Frozen Parameters
# ═════════════════════════════════════════════════════════

parameters:
  # Market Guardian (State Transition Engine)
  state_machine:
    states: [PANIC, STABILIZING, EARLY_RECOVERY, CONFIRMED_RECOVERY, EUPHORIA]
    upgrade_confirmation_days: 3
    downgrade: immediate

  # Recovery Confidence Overlay
  confidence:
    weights:
      vol_repair: 0.50
      trend_confirm: 0.40
      breadth_recovery: 0.10
    bands:
      blocked: "<55"
      small: "55-65"
      normal: "65-75"
      full: ">75"
    anomaly_permission_threshold: 55

  # Anomaly Detector
  anomaly:
    price_drawdown_threshold: -0.15
    roe_range: [0.02, 0.50]
    margin_change_filter: [-0.50, 0.50]
    divergence_threshold: 0.15
    pessimism_floor: 0.40
    strength_floor: 0.40

  # Kill Criteria (hard vetoes)
  kill:
    quality_deterioration: "ROE<0.05 AND margin<-0.05 AND debt>2.0"
    value_trap: "PE_compression>0.9 AND margin<-0.03"
    falling_knife: "drawdown<-0.30 AND margin<-0.10 AND debt>2.5"
    cashflow_divergence: "ROE>0.10 AND cashflow_trend<-0.30"

  # Bayesian Allocation (frozen weights, not evolved)
  bayesian:
    prior_alpha: 2.0
    prior_beta: 2.0
    softmax_temperature: 10.0
    time_decay_half_life_days: 365

# ═════════════════════════════════════════════════════════
# Doctrine Status
# ═════════════════════════════════════════════════════════

doctrine:
  mode: explanation_only
  # Doctrine does NOT participate in stock selection.
  # It generates thesis explanations for audit trail.
  # Test 4 (Shuffle) showed doctrine has no incremental alpha.
  roles:
    quality_compounder: "Has the business deteriorated?"
    contrarian: "Is the market excessively pessimistic?"
    value_purist: "Is the price truly cheap?"
  evolution: disabled

# ═══════════════════════════════════════════════════════════
# Validation Results (v1.1 - 1204 episodes, 2021-08-11 to 2026-07-10)
# ═══════════════════════════════════════════════════════════

validation:
  # 6-S.11.2 Regime Transfer - cross-period stability
  # Reproducible via scripts/run_bootstrap_validation.py Section 0.
  regime_transfer:
    train_period: "2021-08-11 to 2024-12-31"
    test_period: "2025-01-01 to 2026-07-10"
    train_episodes: 832
    test_episodes: 372
    train_block_accuracy: "94.9%"
    test_block_accuracy: "94.4%"
    delta: "-0.6%"
    train_real_miss_rate: "5.1%"
    test_real_miss_rate: "5.6%"
    state_stability:
      STABILIZING: "train 98% -> test 98%"
      EARLY_RECOVERY: "train 97% -> test 97%"
      PANIC: "train 78% -> test 71%"
      CONFIRMED_RECOVERY: "train 93% -> test 100%"
    verdict: "PASS (cross-period stable, not overfit)"

  # 6-S.11.3 Bootstrap Validation - statistical immunity
  # Reproducible via scripts/run_bootstrap_validation.py Section 1.
  bootstrap:
    episodes: 1204                # total evaluated
    block_episodes_with_cf: 1054  # N for bootstrap
    n_iter: 10000
    alpha_median: "+0.1957%"      # mean defensive_alpha, bootstrap median
    alpha_5th_percentile: "+0.1403%"
    alpha_95th_percentile: "+0.2591%"
    p_alpha_negative: "0.00%"     # P(mean defensive_alpha <= 0)
    gate: "p_alpha_negative < 5%"
    verdict: "PASS (defensive alpha statistically significant)"

  # Tail risk protection - catastrophic avoidance
  # Reproducible via scripts/run_bootstrap_validation.py Section 2.
  tail_risk:
    threshold: "counterfactual < -10%"
    total_large_loss_events: 4
    avoided: 4
    avoidance_rate: "100.00%"
    cumulative_avoided_loss: "+49.95%"
    tail_dates: ["2022-03-31", "2024-01-03", "2024-12-13", "2026-04-29"]
    verdict: "PASS (all catastrophic basket-level losses avoided)"

  # False Recovery Immunity - G4 split by risk tier
  # Reproducible via scripts/run_bootstrap_validation.py Section 3.
  # The split isolates Market Guardian's timing responsibility from
  # Security Analyst's selection responsibility, and separates
  # catastrophic timing failures from normal recovery-path noise.
  false_recovery_immunity:
    recovery_state_episodes: 515

    # G4-A1: Catastrophic timing (freeze gate). Market Guardian never
    # permitted BUY ahead of a material market decline (>3%).
    g4_a1_catastrophic_timing:
      threshold: "market_return <= -3%"
      catastrophic_false_recovery: 8
      blocked_correctly: 8
      buy_leak: 0
      immunity_rate: "100.00%"
      gate: "catastrophic_leak = 0"
      verdict: "PASS"

    # G4-A2: Minor timing noise (diagnostic, not gated). Normal
    # recovery-path volatility; the recovery direction was correct
    # but the path had a small drawdown. Forcing blocks here would
    # create an over-conservative model that misses real recoveries.
    g4_a2_minor_timing_noise:
      threshold: "-3% < market_return < 0"
      minor_false_recovery: 14
      blocked_correctly: 11
      buy_leak: 3
      immunity_rate: "78.57%"
      leak_dates: ["2023-01-13", "2023-01-20", "2024-07-08"]
      verdict: "PASS_WITH_NOTE (normal recovery volatility, no tail risk impact)"

    # G4-B: Selection integrity (diagnostic, not gated). Among BUY
    # episodes during recovery, did the basket beat the market?
    # Failures here belong to Security Analyst Reconstruction.
    g4_b_selection_integrity:
      buy_recovery_episodes_with_alpha: 133
      selection_leaks: 3          # alpha < 0
      selection_wins: 130         # alpha >= 0
      leak_rate: "2.3%"
      verdict: "DIAGNOSTIC (selection failures, not timing; deferred to Security Analyst Reconstruction v2)"

    # Def B: forward window check (stricter, diagnostic)
    def_b_forward_window:
      threshold: "CSI300 20d forward return < -3%"
      false_recovery: 100
      blocked: 82
      buy_leak: 18
      immunity_rate: "82.00%"
      verdict: "DIAGNOSTIC (stricter forward-looking check; G4-A1 is the freeze gate)"

  # Yearly stability - no single-year collapse
  # Reproducible via scripts/run_bootstrap_validation.py Section 4.
  yearly_stability:
    "2021": "100.0% (92 episodes)"
    "2022": "89.1% (221 episodes)"
    "2023": "98.2% (228 episodes)"
    "2024": "95.2% (229 episodes)"
    "2025": "94.3% (175 episodes)"
    "2026": "94.5% (109 episodes)"
    min_yearly_accuracy: "89.14% (2022)"
    gate: "all years >= 85%"
    verdict: "PASS"

  overall_verdict: "FROZEN v1.1 (all 5 freeze gates passed)"

