          universal.
        success_criteria:
          alpha: "> 0 (positive in combined)"
          positive_rate: "> 55%"
          n_mid_mid: ">= 30 (statistical power)"
          spread_vs_baseline: "> 3pp (Mid×Mid - overall mean)"
          group_consistency: "Mid×Mid positive in BOTH Group A and Group C"
        failure_implication: |
          If Mid×Mid fails at N=200: the N=8 result was sample-specific.
          Do NOT build v3.6 on it. Fall back to the Gate-vs-Ranker
          principle (still frozen) and explore other intersections.
        priority: "P0"

      exp11b_time_split_validation:
        purpose: "Out-of-sample test - does Mid×Mid survive train/test split?"
        method: |
          Train: 2023-2024 events (N~97)
          Test:  2025-2026 events (N~97)
          Compute Mid×Mid alpha in EACH period separately.
          The 2025-2026 period is OUT-OF-SAMPLE (not used in any prior
          experiment's discovery). If Mid×Mid only works in 2023-2024,
          it is in-sample overfitting.
        success_criteria:
