    # ═══════════════════════════════════════════════════════════
    # Why v3.5.2 (not v3.6)
    # ═══════════════════════════════════════════════════════════
    design_rationale: |
      Exp10 found Mid FRM × Mid Gap = +8.43% (N=8, 75% positive), the
      strongest signal in the entire Stock Sieve chain. But N=8 is a
      STORY, not a STATISTICAL FACT. An institutional researcher would
      ask: is this a real alpha cell, or did a few episodes happen to
      land here?

      DO NOT be tempted by +8.43% to freeze the architecture. The real
      breakthrough of Exp10 is not the specific Mid×Mid result, but the
      DISCOVERY that all previous failures shared one error: treating
      state variables as ranking variables. That insight is frozen
      regardless of whether Mid×Mid survives at larger N.

      v3.5.2 is the validation phase: extend N, test stability across
      time and market regimes, and only THEN decide on v3.6. No
      architecture freeze on N=8.

    # ═══════════════════════════════════════════════════════════
    # The Real Breakthrough (frozen regardless of Mid×Mid survival)
    # ═══════════════════════════════════════════════════════════
    real_breakthrough: |
      Exp10's value is NOT 'Mid×Mid is the answer'. It is the unified
      explanation of WHY all previous single-factor approaches failed:

        RS:     RS_high -> BUY (ranking)           FAILED (v3.2.2)
        EGE:    gap_high -> BUY (ranking)          FAILED (v3.3)
        Sustain: quality_high -> BUY (ranking)     FAILED (v3.4)
        FRM:    score_high -> BUY (ranking)        FAILED (Exp1)

      All made the SAME error: treating a STATE variable as a RANKING
      variable. State variables describe the market's cognitive state,
      not which stock will outperform.

      The correct architecture (frozen principle):
        State variables -> GATES (define candidate universe)
        Intersection of moderate states -> SELECTION (where market
        cannot form consensus = mispricing zone)

      This principle is frozen REGARDLESS of whether Mid×Mid survives
      at N=200. Even if Mid×Mid fails, the Gate-vs-Ranker distinction
      remains the correct framework.

    # ═══════════════════════════════════════════════════════════
    # Architecture Rename (frozen)
    # ═══════════════════════════════════════════════════════════
    architecture_rename: |
      v3.6 should NOT be called 'Uncertainty Asymmetry Detector' (too
      factor-like). The correct name reflects the cognitive architecture:

        OLD name: Recovery Quality Detector
        v3.5 name: Uncertainty Asymmetry Detector
        v3.6 name: Market Belief Disagreement Detector

      The architecture is NOT:
        Factor -> Score -> Stock (factor model)

      The architecture IS:
        Market State -> Candidate Universe -> Investor Disagreement
        -> Mispricing Zone -> Position (cognitive architecture)

      One-line philosophy (frozen):
        Stock Sieve does not find the 'best' stocks. It finds stocks
        where the market cannot reach consensus.

    # ═══════════════════════════════════════════════════════════
    # Sample Unit Clarification (critical)
    # ═══════════════════════════════════════════════════════════
    sample_unit: |
      The sample unit is NOT 'stocks'. It is 'recovery events':
        stock x earnings-announcement x decision-date

      Example: Moutai 2024Q1 earnings, CATL 2023Q3 earnings, etc.
      N=200 means 200 recovery events, not 200 stocks. The same stock
      can appear multiple times at different earnings events.

      Current inventory (verified):
        Group A (FRM-only): 60 events (2023-2026)
        Group C (FRM+RS):   134 events (2024-2026)
        Combined:           194 events (close to 200 target)

