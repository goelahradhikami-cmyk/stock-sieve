        - False blocks are not random - they systematically catch good opportunities

      ARS upgrades: Discovery -> Replication (Tests 1-3)
      ARS does NOT advance to: Validated Risk Filter (Test 4 blocks)

      IDENTITY: ARS is an observation variable / diagnostic indicator.
      It can INFORM risk analysis but cannot DRIVE exposure policy.

      The system remains:
        Guardian -> FRM gate -> Static Bayesian Portfolio
      ARS is available as a diagnostic readout, not as a policy input.

