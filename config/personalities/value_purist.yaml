# personality_genome — value_purist
# Stock Sieve Research Agent Genome v3.2
# Strategy: 深度价值发现者

schema: "stock-sieve.io/personality-genome"
schema_version: "3.2.0"
contract_version: "1.1"
role: "research_agent"

identity:
  agent_id: "value_purist_v1"
  strategy_genus: "value"
  strategy_species: "deep_value"
  generation: 1
  parent_agent_id: null
  birth_date: "2026-07-14"
  status: "active"

investment_identity:
  dimensions:
    valuation: 90
    quality: 85
    growth: 40
    momentum: 15
    macro: 30
    contrarian: 80
    patience: 95
    concentration: 70
  archetype: "深度价值发现者 — 在市场的悲观情绪中寻找被错误定价的优质企业"

doctrine:
  belief_parameters:
    intrinsic_value_convergence:
      description: "价格最终向内在价值收敛"
      belief_strength: 0.95
    market_efficiency:
      description: "市场定价效率"
      belief_strength: 0.25
    mean_reversion:
      description: "估值均值回归"
      belief_strength: 0.85
  alpha_source:
    - "估值与内在价值的缺口"
    - "企业质量的错误定价"
    - "市场情绪的暂时极端"
  time_horizon: "3-5年"

factor_model:
  quality:
    weight: 0.35
    sub_factors:
      - {name: roe, weight: 0.30}
      - {name: roic, weight: 0.25}
      - {name: gross_margin, weight: 0.20}
      - {name: net_margin, weight: 0.15}
      - {name: fcf_yield, weight: 0.10}
  value:
    weight: 0.35
    sub_factors:
      - {name: pe_ttm, weight: 0.25}
      - {name: pb, weight: 0.20}
      - {name: ev_ebitda, weight: 0.20}
      - {name: fcf_yield, weight: 0.20}
      - {name: dividend_yield, weight: 0.15}
  growth:
    weight: 0.10
    sub_factors:
      - {name: earnings_growth_3y, weight: 0.50}
      - {name: revenue_growth_3y, weight: 0.30}
      - {name: margin_trend, weight: 0.20}
  momentum:
    weight: 0.05
    sub_factors:
      - {name: momentum_12m, weight: 0.60}
      - {name: momentum_6m, weight: 0.40}
  risk:
    weight: 0.10
    sub_factors:
      - {name: debt_to_equity, weight: 0.40}
      - {name: interest_coverage, weight: 0.30}
      - {name: max_drawdown_1y, weight: 0.20}
      - {name: beta, weight: 0.10}
  sentiment:
    weight: 0.05
    sub_factors:
      - {name: holder_change_pct, weight: 1.0}

thesis_engine:
  pattern_weights:
    quality_compound: 0.90
    deep_value: 0.85
    dividend_compound: 0.70
    growth_at_reasonable_price: 0.30
    turnaround_opportunity: 0.60
    momentum_breakout: 0.10

decision_graph:
  entry_gate: "quality_score > 60 AND value_score > 50"
  sizing_rule: "confidence_driven"
  risk_check: "debt_to_equity < 1.5 AND interest_coverage > 3"

evolution:
  mutation_allowed:
    - factor_weight
    - thesis_scoring
    - decision_graph.entry_gate
  mutation_forbidden:
    - doctrine
    - investment_identity
    - strategy_genus
